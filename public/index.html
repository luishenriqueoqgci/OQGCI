<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Diagnóstico de vendas com base em neurociência: Índice OQGCI, perfil e trilha de 30 dias.">
<meta name="theme-color" content="#0F0E14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OQGCI">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<title>Diagnóstico OQGCI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: uma coluna central de leitura (max 1080px) sobre fundo tinta-violeta; telas de questionário em cartão único, pensadas primeiro para o celular. */
:root {
  color-scheme: dark;
  --bg: #0F0E14;
  --surface: #18161F;
  --surface-2: #211E2A;
  --line: #2F2B3A;
  --ink: #EFEBF5;
  --ink-2: #B6B0C4;
  --ink-3: #868097;
  --accent: #F0B35E;
  --accent-strong: #F6C77F;
  --accent-ink: #1C1408;
  --cool: #8DB8EE;
  --c-warm: #C2831E;
  --c-cool: #4A8BDC;
  --c-third: #C2559F;
  --good: #5FBF8F;
  --warn: #E8B44A;
  --crit: #E4707A;
  --font-display: "Urbanist", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  --r-sm: 10px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
}
a { color: var(--accent); text-underline-offset: 3px; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0; }
.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.narrow { max-width: 720px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.tnum { font-variant-numeric: tabular-nums; }

/* Barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand span { white-space: nowrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: 0.01em; }
.brand svg { flex: none; }
.nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.nav button, .nav a { background: none; border: 0; color: var(--ink-2); font-size: 14px; font-weight: 600; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-decoration: none; }
.nav button:hover, .nav a:hover { color: var(--ink); background: var(--surface); }
.demo-strip { background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.demo-strip .wrap { padding-block: 8px; display: flex; gap: 8px; align-items: center; }
.demo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; padding: 14px 26px; font-weight: 700; font-size: 15px; letter-spacing: 0.04em; cursor: pointer; border: 1px solid transparent; text-decoration: none; transition: transform .15s ease, background-color .15s ease, border-color .15s ease; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: linear-gradient(180deg, var(--accent-strong), var(--accent)); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-strong); }
.btn-ghost { background: transparent; color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-quiet { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.btn-quiet:hover { border-color: var(--ink-3); }
.btn-sm { padding: 9px 16px; font-size: 14px; letter-spacing: 0.02em; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link-btn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* Landing */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero::before { content: ""; position: absolute; inset: -20% -10% auto -10%; height: 140%; background:
  radial-gradient(40% 50% at 22% 40%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
  radial-gradient(38% 46% at 82% 55%, color-mix(in srgb, var(--cool) 16%, transparent), transparent 70%);
  pointer-events: none; }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.9fr); gap: 48px; align-items: center; padding-block: 72px 64px; }
.pill { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 999px; padding: 8px 16px; }
.hero h1 { font-weight: 300; font-size: clamp(38px, 6vw, 64px); line-height: 1.04; margin-top: 24px; }
.hero h1 .gold { display: block; font-weight: 600; color: var(--accent); }
.hero .lead { font-size: 18px; color: var(--ink-2); max-width: 34em; margin-top: 22px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; align-items: center; }
.ref-link { display: inline-flex; gap: 8px; align-items: center; margin-top: 22px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); background: none; border: 0; cursor: pointer; padding: 4px 0; }
.ref-link:hover { color: var(--ink); }

.sample { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: 0 30px 80px -40px rgba(0,0,0,.8); }
.sample-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); border: 1px dashed var(--line); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.big-num { font-family: var(--font-display); font-weight: 300; font-size: 72px; line-height: 1; letter-spacing: -0.03em; }
.big-num small { font-size: 22px; color: var(--ink-3); font-weight: 400; margin-left: 4px; }
.level-chip { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 5px 12px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-strong); font-weight: 700; font-size: 13px; }

.section { padding-block: 64px; border-bottom: 1px solid var(--line); }
.section-head { display: grid; gap: 10px; margin-bottom: 32px; max-width: 46em; }
.section-head h2 { font-size: clamp(26px, 3.4vw, 36px); }
.axis-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.axis-col { border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; align-content: start; background: var(--surface); }
.axis-col h3 { font-size: 20px; display: flex; gap: 10px; align-items: center; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.dim-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.dim-code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); padding-top: 3px; }
.dim-row strong, .base-band strong { display: block; font-weight: 700; }
.base-band { margin-top: 16px; border: 1px solid var(--line); border-radius: var(--r); padding: 20px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 10%, var(--surface)), color-mix(in srgb, var(--cool) 8%, var(--surface))); display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; counter-reset: s; }
.step { border-top: 1px solid var(--accent); padding-top: 16px; display: grid; gap: 8px; }
.step-n { font-family: var(--font-mono); font-size: 12px; color: var(--accent); letter-spacing: 0.12em; }
.step h3 { font-size: 20px; }
.who { display: flex; flex-wrap: wrap; gap: 8px; }
.who span { border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; color: var(--ink-2); font-size: 14px; background: var(--surface); }
.foot { padding-block: 40px 56px; color: var(--ink-3); font-size: 14px; }
.foot .wrap { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; }

/* Formulários e cartões */
.page { padding-block: 40px 72px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; }
.stack { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.stack-lg { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.field input[type=text], .field input[type=email], .field input[type=password] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 13px 14px; font-size: 16px; }
.field input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.check { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 10px; font-size: 14px; color: var(--ink-2); align-items: start; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { border: 0; background: none; padding: 10px; border-radius: 999px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.tabs button[aria-selected=true] { background: var(--surface-2); color: var(--ink); }
.msg { border-radius: var(--r-sm); padding: 12px 14px; font-size: 14px; border: 1px solid var(--line); background: var(--bg); }
.msg-err { border-color: color-mix(in srgb, var(--crit) 55%, transparent); color: #F4B9BF; }
.msg-ok { border-color: color-mix(in srgb, var(--good) 55%, transparent); color: #BFE8D2; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 13px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* Questionário */
.quiz { max-width: 640px; margin: 0 auto; padding-block: 28px 64px; }
.progress { display: grid; gap: 8px; margin-bottom: 22px; }
.progress-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-3); font-family: var(--font-mono); letter-spacing: 0.06em; }
.bar { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .25s ease; }
.q-text { font-family: var(--font-display); font-size: clamp(22px, 4.6vw, 28px); line-height: 1.28; font-weight: 500; min-height: 3.9em; }
.q-hint { margin-top: 10px; color: var(--ink-3); font-size: 14px; }
.opts { display: grid; gap: 10px; margin-top: 24px; }
.opt { touch-action: manipulation; -webkit-tap-highlight-color: transparent; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px 16px; cursor: pointer; transition: border-color .12s ease, background-color .12s ease; }
.opt:hover { border-color: var(--ink-3); }
.opt[aria-pressed=true] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.opt-k { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); color: var(--ink-2); }
.opt[aria-pressed=true] .opt-k { background: var(--accent); color: var(--accent-ink); }
.opt[aria-pressed=true] .opt-t::after { content: "  ✓ marcada"; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; color: var(--accent-strong); font-weight: 500; }
.q-enter { animation: qin .28s ease both; }
@keyframes qin { from { opacity: .2; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.opt-t { font-weight: 600; }
.quiz-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 12px; }
.scene { border-left: 2px solid var(--cool); padding-left: 16px; }
.likert { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 24px; }
.lk { display: grid; justify-items: center; align-content: start; gap: 10px; padding: 16px 6px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); cursor: pointer; text-align: center; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: border-color .12s ease, background-color .12s ease; min-width: 0; }
.lk:hover { border-color: var(--ink-3); }
.lk-n { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 15px; background: var(--surface-2); color: var(--ink-2); }
.lk-t { font-size: 13px; font-weight: 600; line-height: 1.25; color: var(--ink-2); overflow-wrap: break-word; hyphens: manual; max-width: 100%; }
.lk[aria-pressed=true] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.lk[aria-pressed=true] .lk-n { background: var(--accent); color: var(--accent-ink); }
.lk[aria-pressed=true] .lk-t { color: var(--ink); }
.likert-ends { display: flex; justify-content: space-between; margin-top: 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.field textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 13px 14px; font-size: 16px; line-height: 1.5; resize: vertical; min-height: 160px; }
.field textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dim-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.dim-card { display: grid; gap: 12px; align-content: start; }
.dim-card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.dl-mini { margin: 0; display: grid; gap: 6px; font-size: 14px; }
.dl-mini dt { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.dl-mini dd { margin: 0 0 6px; }
.sit-list { display: grid; }
.sit { display: grid; gap: 6px; padding-block: 14px; border-top: 1px solid var(--line); }
.sit:first-child { border-top: 0; padding-top: 4px; }
.sit-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.story { margin: 0; padding: 14px 16px; border-left: 2px solid var(--accent); background: var(--bg); border-radius: 0 var(--r-sm) var(--r-sm) 0; color: var(--ink); white-space: pre-wrap; font-size: 15px; }
.mov-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mov { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px; background: var(--bg); display: grid; gap: 6px; align-content: start; }
.mov-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.key-point { border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border-radius: var(--r-sm); padding: 14px 16px; display: grid; gap: 6px; }
.guide { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 15px; }
.cta-card { display: grid; gap: 10px; background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 12%, var(--surface)), var(--surface) 60%); }
.dots { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: middle; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
.gauge-wrap { max-width: 320px; width: 100%; margin: 4px auto 0; }
.gauge-wrap svg, .map-wrap svg { width: 100%; height: auto; display: block; }
.map-wrap { max-width: 340px; margin: 0 auto; }
.level-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; font-size: 11.5px; text-align: center; }
.level-steps span { padding: 6px 2px; border-radius: 6px; background: var(--surface-2); color: var(--ink-3); font-weight: 600; }
.level-steps span.on { background: color-mix(in srgb, var(--accent) 20%, var(--surface)); color: var(--accent-strong); }
.lvl-meter { width: 100%; }
.lvl-track { position: relative; height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.lvl-track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
.lvl-track > span { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--bg); opacity: .9; }
.acc-headrow { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.acc-headrow .btn { width: auto; }
.acc-list { display: grid; gap: 10px; }
.acc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); }
.acc[open] { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.acc summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto 18px; gap: 14px; align-items: center; padding: 14px 16px; }
.sit-acc summary { grid-template-columns: minmax(0, 1fr) auto 18px; }
.acc summary::-webkit-details-marker { display: none; }
.acc-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.acc-title .flag { margin-left: 0; }
.acc-score { display: grid; justify-items: end; line-height: 1.2; }
.acc-score b { font-size: 18px; }
.chev { width: 10px; height: 10px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg); justify-self: center; transition: transform .15s ease; margin-top: -4px; }
.acc[open] .chev { transform: rotate(225deg); margin-top: 4px; }
.field-label { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.seg-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 10px; font-weight: 600; font-size: 14px; cursor: pointer; text-align: center; color: var(--ink-2); touch-action: manipulation; }
.seg:hover { border-color: var(--ink-3); }
.seg[aria-pressed=true] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--ink); }
.prio-n { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 14px; flex: none; align-self: center; }
.path { list-style: none; margin: 0; padding: 0; display: grid; }
.path-step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 18px; }
.path-step:not(:last-child)::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.path-step.done:not(:last-child)::before { background: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.path-n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; border: 1.5px solid var(--line); color: var(--ink-3); background: var(--surface); z-index: 1; }
.path-step.done .path-n { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); border-color: var(--accent); color: var(--accent-strong); }
.path-step.cur .path-n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.path-c { display: grid; gap: 8px; padding-top: 5px; min-width: 0; }
.path-step.locked .path-c .eyebrow { color: var(--ink-3); opacity: .6; }

function V(t, voc) {
  if (!voc || t == null) return t;
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
  return String(t)
    .replace(/\{clientes\}/g, voc.clientes).replace(/\{cliente\}/g, voc.cliente).replace(/\{atendimento\}/g, voc.atendimento)
    .replace(/\{primeiro\}/g, voc.primeiro).replace(/\{oferta\}/g, voc.oferta)
    .replace(/\bClientes\b/g, cap(voc.clientes)).replace(/\bclientes\b/g, voc.clientes)
    .replace(/\bCliente\b/g, cap(voc.cliente)).replace(/\bcliente\b/g, voc.cliente);
}
function negocioLinha(rec) {
  const n = rec?.respostas?.negocio; if (!n || !n.segmento) return '';
  return 'Seu negócio: ' + (SEG[n.segmento]?.nome || 'Outro') + (n.oferta ? ' · ' + n.oferta : '');
}

/* =============================== PONTUAÇÃO ================================ */
const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
const r0 = v => Math.round(v);

function median(arr) { const a = [...arr].sort((x, y) => x - y); const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }
// Sinais de resposta: cada pergunta é comparada com o ritmo da própria pessoa. Pausas acima de 2 minutos ficam de fora.
function analyzeSignals(meta) {
  if (!meta) return null;
  const itemMs = ITEMS.map(i => meta[i.c]?.ms).filter(v => v > 0);
  if (itemMs.length < 10) return null;
  const mI = median(itemMs);
  const sjtMs = SJT.map(s => meta[s.id]?.ms).filter(v => v > 0);
  const mS = sjtMs.length ? median(sjtMs) : 0;
  const hes = [], chg = [];
  ITEMS.forEach(i => { const m = meta[i.c]; if (!m) return; if (m.ms >= Math.max(2 * mI, 8000)) hes.push(i.c); if (m.changes > 0) chg.push(i.c); });
  SJT.forEach(s => { const m = meta[s.id]; if (!m) return; if (mS && m.ms >= Math.max(2 * mS, 15000)) hes.push(s.id); if (m.changes > 0) chg.push(s.id); });
  const dimOf = k => (ITEMS.find(i => i.c === k) || {}).d || SJT_DIM[k];
  const porDim = {};
  [...hes, ...chg].forEach(k => { const d = dimOf(k); if (d) porDim[d] = (porDim[d] || 0) + 1; });
  const interrupcoes = Object.values(meta).reduce((t, m) => t + (m.long || 0), 0);
  return { medianaSeg: Math.round(mI / 100) / 10, hesitacoes: hes, trocas: chg, porDim, interrupcoes, rapido: mI < 2500 };
}

function scoreAnswers(items, sjt, meta) {
  const dims = {};
  let d8Items = 0;
  for (const d of DIMS) {
    const vals = ITEMS.filter(i => i.d === d.id).map(i => i.inv ? 6 - items[i.c] : items[i.c]);
    dims[d.id] = (avg(vals) - 1) / 4 * 100;
  }
  d8Items = dims.D8;
  const postura = { passiva: 0, assertiva: 0, agressiva: 0 };
  for (const s of SJT) postura[sjt[s.id]] += 1;
  const pctAssert = postura.assertiva / SJT.length * 100;
  dims.D8 = 0.7 * d8Items + 0.3 * pctAssert;

  const aprox = avg(['D2', 'D3', 'D4', 'D7'].map(k => dims[k]));
  const afast = avg(['D5', 'D6', 'D8'].map(k => dims[k]));
  const indice = avg(DIMS.map(d => dims[d.id]));

  const alerts = [];
  const base = dims.D1 < 50 || sjt.S6 !== 'assertiva';
  if (base) alerts.push({ k: 'base', sev: 'crit', t: 'Base frágil', d: 'A técnica sem a linha de base reduz a sinceridade percebida pelo cliente. Propósito passa a ser a sua primeira prioridade.' });
  if (postura.agressiva >= 2) alerts.push({ k: 'pressao', sev: 'crit', t: 'Pressão', d: 'Em duas ou mais situações, a sua resposta pressiona o cliente. Sob pressão, ele entra em modo de defesa e decide pior.' });
  if (postura.passiva >= 3) alerts.push({ k: 'concessao', sev: 'warn', t: 'Concessão', d: 'Em três ou mais situações, o valor do seu trabalho cede antes de o cliente pedir.' });
  if (aprox - afast >= 20) alerts.push({ k: 'deseq', sev: 'warn', t: 'Desequilíbrio OQGCI', d: 'O cliente percebe o ganho e adia a decisão. Fortaleça Custo, Caminho e Condução.' });
  if (afast - aprox >= 20) alerts.push({ k: 'deseq', sev: 'warn', t: 'Desequilíbrio OQGCI', d: 'O cliente sente a urgência e ainda não enxerga o ganho. Fortaleça Presença, Espelho, Virada e Quem decide.' });

  const has = k => alerts.some(a => a.k === k);
  const minDim = Math.min(...DIMS.map(d => dims[d.id]));
  let perfil = 'desenvolvimento';
  if (has('pressao') || (d8Items >= 60 && dims.D1 < 50)) perfil = 'insistente';
  else if (indice < 45) perfil = 'reativo';
  else if (dims.D1 >= 65 && dims.D3 >= 65 && avg([dims.D4, dims.D5, dims.D6]) < 55 && has('concessao')) perfil = 'prestativo';
  else if ((dims.D2 >= 60 || dims.D4 >= 60) && dims.D3 < 50) perfil = 'especialista';
  else if (indice >= 70 && minDim >= 55 && postura.assertiva >= 4) perfil = 'conselheiro';

  const sorted = DIMS.map(d => d.id).sort((a, b) => dims[a] - dims[b]);
  let prioridades = sorted.slice(0, 3);
  if (base && !prioridades.includes('D1')) prioridades = ['D1', ...prioridades.slice(0, 2)];
  else if (base) prioridades = ['D1', ...prioridades.filter(x => x !== 'D1')];
  const forcas = sorted.slice().reverse().filter(x => !prioridades.includes(x)).slice(0, 3);

  const round = {};
  for (const k in dims) round[k] = r0(dims[k]);
  return {
    v: 1,
    dims: round,
    indice: r0(indice), aprox: r0(aprox), afast: r0(afast),
    nivel: levelOf(r0(indice)).nome,
    postura, perfil, alerts, prioridades, forcas,
    sinais: analyzeSignals(meta)
  };
}

const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return 'h' + (h >>> 0).toString(36); };

function seedExamples() {
  const now = Date.now();
  const mk = (n, means, sjtPattern) => {
    const items = {};
    const offs = [0.4, -0.4, 0.2, -0.2, 0];
    for (const d of DIMS) {
      const its = ITEMS.filter(i => i.d === d.id);
      its.forEach((it, k) => {
        let v = Math.min(5, Math.max(1, Math.round(means[d.id] + offs[k % offs.length])));
        items[it.c] = it.inv ? 6 - v : v;
      });
    }
    const sjt = {};
    SJT.forEach((s, k) => { sjt[s.id] = sjtPattern[k]; });
    const resultado = scoreAnswers(items, sjt);
    return { id: 'ex-' + n, user_id: 'ex-user-' + n, nome: 'Exemplo ' + n, turma_id: 'turma-exemplo', respostas: { items, sjt }, resultado, created_at: new Date(now - n * 86400000 * 0.7).toISOString(), exemplo: true };
  };
  const A = 'assertiva', P = 'passiva', G = 'agressiva';
  const all = v => Object.fromEntries(DIMS.map(d => [d.id, v]));
  return [
    mk(1, all(4.6), [A, A, A, A, A, A]),
    mk(2, { D1: 4.7, D2: 3.4, D3: 4.5, D4: 2.6, D5: 2.2, D6: 2.6, D7: 3.2, D8: 2.8 }, [P, P, P, A, A, A]),
    mk(3, { D1: 3.6, D2: 4.3, D3: 2.5, D4: 4.1, D5: 3.3, D6: 3.4, D7: 3.0, D8: 3.4 }, [A, A, P, A, G, A]),
    mk(4, { D1: 2.3, D2: 3.4, D3: 3.0, D4: 3.3, D5: 3.8, D6: 3.9, D7: 3.1, D8: 4.3 }, [G, G, A, G, A, A]),
    mk(5, all(2.3), [P, P, A, P, A, A]),
    mk(6, { D1: 3.8, D2: 3.1, D3: 3.6, D4: 3.0, D5: 3.2, D6: 3.5, D7: 2.8, D8: 3.4 }, [A, A, A, P, A, A]),
    mk(7, { D1: 4.4, D2: 4.0, D3: 4.3, D4: 3.9, D5: 3.7, D6: 4.2, D7: 3.9, D8: 4.0 }, [A, A, A, A, P, A]),
    mk(8, { D1: 4.1, D2: 2.9, D3: 4.0, D4: 3.1, D5: 2.9, D6: 3.0, D7: 3.6, D8: 3.0 }, [P, A, P, A, A, A])
  ];
}

    },
    async resetPassword() { return { demo: true }; },
    async signOut() { db.session = null; save(); },

    async saveResult({ turma_id, respostas, resultado }) {
      const u = db.users.find(x => x.id === db.session);
      const rec = { id: uid(), user_id: u.id, nome: u.nome, turma_id: turma_id || null, respostas, resultado, created_at: new Date().toISOString() };
      db.results.push(rec); save(); return rec;
    },
    async myResults() { return db.results.filter(r => r.user_id === db.session).sort((a, b) => b.created_at.localeCompare(a.created_at)); },
    async getResult(id) { return db.results.find(r => r.id === id) || null; },
    async updateLeitura(id, leitura) { const r = db.results.find(x => x.id === id); if (r) { r.resultado.leitura = leitura; save(); } },
    async listTurmas() { return db.turmas.slice().sort((a, b) => (b.created_at || '').localeCompare(a.created_at || '')); },
    async createTurma(nome, perguntar) { const t = { id: uid(), nome: nome.trim(), codigo: genCode(), perguntar_nicho: perguntar !== false, created_at: new Date().toISOString() }; db.turmas.push(t); save(); return t; },
    async updateTurma(id, patch) { const t = db.turmas.find(x => x.id === id); if (t) { Object.assign(t, patch); save(); } return t; },
    async turmaResults(turmaId) {
      return db.results.filter(r => turmaId === 'todos' ? true : turmaId === 'sem' ? !r.turma_id : r.turma_id === turmaId).sort((a, b) => b.created_at.localeCompare(a.created_at));
    }
  };
}

/* ======================= ARMAZENAMENTO · SUPABASE ========================= */
function LiveStore() {
  let sb = null;
  let profileCache = null;
  const toRec = r => ({ id: r.id, user_id: r.user_id, nome: r.profiles?.nome || '', turma_id: r.turma_id, respostas: r.respostas, resultado: r.resultado, created_at: r.created_at });
  const errPt = e => {
    const m = (e && e.message) || '';
    if (/Invalid login credentials/i.test(m)) return new Error('E-mail ou senha não conferem. Confira os dados ou crie uma conta.');
    if (/Email not confirmed/i.test(m)) return new Error('Confirme o seu e-mail pelo link que enviamos antes de entrar.');
    if (/already registered/i.test(m)) return new Error('Já existe uma conta com este e-mail. Use a aba Entrar.');
    if (/Password should be at least/i.test(m)) return new Error('A senha precisa ter pelo menos 6 caracteres.');
    if (/rate limit/i.test(m)) return new Error('Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente de novo.');
    return new Error(m || 'Não foi possível concluir. Verifique a conexão e tente de novo.');
  };
  async function profile() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { profileCache = null; return null; }
    if (profileCache && profileCache.id === session.user.id) return profileCache;
    const { data } = await sb.from('profiles').select('id, nome, email, role').eq('id', session.user.id).maybeSingle();
    profileCache = data || { id: session.user.id, nome: session.user.user_metadata?.nome || '', email: session.user.email, role: 'respondente' };
    return profileCache;
  }
  return {
    mode: 'live',
    async init(onRecovery) {
      const mod = await import(SUPABASE_ESM);
      sb = mod.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
      sb.auth.onAuthStateChange((ev) => { profileCache = null; if (ev === 'PASSWORD_RECOVERY' && onRecovery) onRecovery(); });
    },
    getSession: profile,
    async signUp({ nome, email, senha }) {
      const { data, error } = await sb.auth.signUp({ email: email.trim(), password: senha, options: { data: { nome: nome.trim() }, emailRedirectTo: location.origin + location.pathname } });
      if (error) throw errPt(error);
      return { user: data.session ? await profile() : null, needsConfirm: !data.session };
    },
    async signIn({ email, senha }) {
      const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: senha });
      if (error) throw errPt(error);
      return profile();
    },
    async resetPassword(email) {
      const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.origin + location.pathname });
      if (error) throw errPt(error);
      return {};
    },
    async accessToken() { const { data: { session } } = await sb.auth.getSession(); return session?.access_token || ''; },
    async updatePassword(senha) { const { error } = await sb.auth.updateUser({ password: senha }); if (error) throw errPt(error); },
    async signOut() { await sb.auth.signOut(); profileCache = null; },
    async findTurma(codigo) { const { data, error } = await sb.rpc('turma_por_codigo', { p_codigo: codigo.trim() }); if (error) throw errPt(error); return (data && data[0]) || null; },
    async saveResult({ turma_id, respostas, resultado }) {
      const p = await profile();
      const { data, error } = await sb.from('resultados').insert({ user_id: p.id, turma_id: turma_id || null, respostas, resultado, indice: resultado.indice, nivel: resultado.nivel, perfil: resultado.perfil }).select('*, profiles(nome)').single();
      if (error) throw errPt(error);
      return toRec(data);
    },
    async myResults() {
      const p = await profile();
      const { data, error } = await sb.from('resultados').select('*, profiles(nome)').eq('user_id', p.id).order('created_at', { ascending: false });
      if (error) throw errPt(error); return data.map(toRec);
    },
    async getResult(id) { const { data, error } = await sb.from('resultados').select('*, profiles(nome)').eq('id', id).maybeSingle(); if (error) throw errPt(error); return data ? toRec(data) : null; },
    async updateTurma(id, patch) { const { data, error } = await sb.from('turmas').update(patch).eq('id', id).select().single(); if (error) throw new Error(/perguntar_nicho/i.test(error.message) ? 'Atualize o banco de dados com o complemento enviado pelo Claude para usar esta opção.' : errPt(error).message); return data; },
    async listTurmas() { const { data, error } = await sb.from('turmas').select('*').order('created_at', { ascending: false }); if (error) throw errPt(error); return data; },
    async createTurma(nome, perguntar) {
      let comNicho = true;
      for (let i = 0; i < 5; i++) {
        const row = { nome: nome.trim(), codigo: genCode() };
        if (comNicho) row.perguntar_nicho = perguntar !== false;
        const { data, error } = await sb.from('turmas').insert(row).select().single();
        if (!error) return data;
        if (/perguntar_nicho/i.test(error.message)) { comNicho = false; continue; }
        if (!/duplicate/i.test(error.message)) throw errPt(error);
      }
      throw new Error('Não foi possível gerar um código único. Tente de novo.');
    },
    async turmaResults(turmaId) {
      let q = sb.from('resultados').select('*, profiles(nome)').order('created_at', { ascending: false });
      if (turmaId === 'sem') q = q.is('turma_id', null); else if (turmaId !== 'todos') q = q.eq('turma_id', turmaId);
      const { data, error } = await q; if (error) throw errPt(error); return data.map(toRec);
    }
  };
}

}

const HIST_MIN = 20;
function startQuiz() {
  const d = LS.get(DRAFT_KEY);

  if (!S.quiz.meta) S.quiz.meta = {};
}
const TOTAL = ITEMS.length + SJT.length + 1;
function saveDraft() { LS.set(DRAFT_KEY, S.quiz); }
function keyOfStep(step) {
  const idx = step - 1;
  if (idx < 0) return null;
  if (idx < ITEMS.length) return ITEMS[idx].c;
  if (idx < ITEMS.length + SJT.length) return SJT[idx - ITEMS.length].id;
  return 'historia';
}

// Registro do tempo de cada pergunta na tela (descontando a aba em segundo plano) e das trocas de resposta.
function closeVisit() {
  const v = S.qv; if (!v) return;
  const el = performance.now() - v.t0 - v.hidden - (v.hiddenAt ? performance.now() - v.hiddenAt : 0);
  const key = keyOfStep(v.step);
  if (key && v.quiz && v.quiz.meta) {
    const m = v.quiz.meta[key] || (v.quiz.meta[key] = { ms: 0, visits: 0, changes: 0, long: 0 });
    m.visits += 1;
    if (el > 120000) m.long += 1; else m.ms += Math.round(el);
  }
  S.qv = null;
}
function trackVisit() {
  const q = S.quiz;
  const cur = (S.route === 'diagnostico' && q && q.step > 0) ? q.step : null;
  if (S.qv && (S.qv.step !== cur || S.qv.quiz !== q)) { closeVisit(); if (q) saveDraft(); }
  if (cur && !S.qv) S.qv = { step: cur, t0: performance.now(), hidden: 0, hiddenAt: null, quiz: q };
}
document.addEventListener('visibilitychange', () => {
  const v = S.qv; if (!v) return;
  if (document.hidden) v.hiddenAt = performance.now();
  else if (v.hiddenAt) { v.hidden += performance.now() - v.hiddenAt; v.hiddenAt = null; }
});
function noteChange(key, prev, next) {
  if (prev == null || prev === next) return;
  const m = S.quiz.meta[key] || (S.quiz.meta[key] = { ms: 0, visits: 0, changes: 0, long: 0 });
  m.changes += 1;
}

}

function radar(dims) {
  const cx = 200, cy = 178, R = 118;
  const order = ['D1', 'D2', 'D3', 'D4', 'D7', 'D5', 'D6', 'D8'];
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / order.length;
  const pt = (i, v) => [cx + Math.cos(ang(i)) * R * v / 100, cy + Math.sin(ang(i)) * R * v / 100];
  const rings = [25, 50, 75, 100].map(v => `<polygon points="${order.map((_, i) => pt(i, v).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');
  const spokes = order.map((_, i) => { const [x, y] = pt(i, 100); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; }).join('');
  const poly = order.map((k, i) => pt(i, dims[k]).join(',')).join(' ');
  const dots = order.map((k, i) => { const [x, y] = pt(i, dims[k]); return `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>${DIM[k].nome}: ${dims[k]}</title></circle>`; }).join('');
  const labels = order.map((k, i) => {
    const [x, y] = pt(i, 100); const a = ang(i); const c = Math.cos(a);
    const lx = x + Math.cos(a) * 16, ly = y + Math.sin(a) * 16 + 4;
    const anchor = Math.abs(c) < 0.2 ? 'middle' : c > 0 ? 'start' : 'end';
    const col = DIM[k].eixo === 'aprox' ? 'var(--c-warm)' : DIM[k].eixo === 'afast' ? 'var(--cool)' : 'var(--ink-2)';
    return `<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="12.5" fill="var(--ink-2)" font-family="Manrope, sans-serif"><tspan fill="${col}">●</tspan> ${DIM[k].nome} <tspan font-weight="700" fill="var(--ink)">${dims[k]}</tspan></text>`;
  }).join('');
  const ticks = [50, 100].map(v => { const [x, y] = pt(0, v); return `<text x="${x + 5}" y="${y + 12}" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">${v}</text>`; }).join('');
  return `<svg viewBox="-40 0 480 350" role="img" aria-label="Radar das oito dimensões">${rings}${spokes}<polygon points="${poly}" fill="var(--accent)" fill-opacity=".16" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${dots}${labels}${ticks}</svg>`;
}

const bandOf = v => v >= 75 ? 'alto' : v >= 50 ? 'medio' : 'baixo';
const POSTURA_NOME = { assertiva: 'Assertiva', passiva: 'Passiva', agressiva: 'Agressiva' };
const POSTURA_COR = { assertiva: 'var(--c-warm)', passiva: 'var(--c-cool)', agressiva: 'var(--c-third)' };

function itemExtremes(dimId, items) {
  const its = ITEMS.filter(i => i.d === dimId && items && items[i.c] != null).map(i => ({ i, r: items[i.c], a: i.inv ? 6 - items[i.c] : items[i.c] }));
  if (!its.length) return null;
  const sorted = its.slice().sort((x, y) => y.a - x.a);
  const best = sorted[0], worst = sorted[sorted.length - 1];
  return best.a === worst.a ? { uniforme: true, a: best.a } : { best, worst };
}

História, entre as marcas <historia>:

${rec.respostas.historia}
</historia>

Analise a história com base apenas no que está escrito. Quando a história não mostrar um movimento, diga que ele não aparece no relato, sem inventar fatos. Escreva em português do Brasil, em tom direto, respeitoso e profissional, sem tom professoral, falando com a pessoa como "você". Não use construções de contraste como "não é X, é Y" ou "X, e não Y". Não faça avaliações de personalidade ou de saúde. Frases curtas.

Responda somente com um objeto JSON neste formato:
{"sintese": "duas ou três frases sobre o que a história mostra da conversa de venda",
 "movimentos": [
  {"nome": "Espelho", "status": "presente" | "parcial" | "ausente", "evidencia": "o trecho ou fato do relato que sustenta a avaliação, ou que ele não aparece no relato", "como_fortalecer": "uma ação concreta para uma conversa parecida"},
  {"nome": "Virada", ...}, {"nome": "Custo", ...}, {"nome": "Caminho", ...}
 ],
 "quem_decide": "uma frase sobre quem participava da decisão e se foi considerado",
 "postura": "uma frase sobre a postura na conversa: passiva, assertiva ou agressiva, com base no relato",
 "ponto_chave": "uma frase com o principal ajuste que teria mais chance de mudar o resultado"}`;
}

async function getSampler() {
  try { if (window.claude && typeof window.claude.use === 'function') return await window.claude.use('sample'); } catch (e) { /* */ }
  return null;
}

async function runLeitura(rec) {
  const id = rec.id;
  S.leitura[id] = { st: 'loading' }; patchLeitura(rec);
  const prompt = leituraPrompt(rec);
  try {
    let data = null;
    const sample = await getSampler();
    if (sample) {
      data = await sample.json(prompt, { modelTier: 'default' });
    } else if (LIVE && CONFIG.leituraIA) {
      const token = await store.accessToken();
      const res = await fetch('/.netlify/functions/leitura', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: JSON.stringify({ prompt }) });
      if (!res.ok) throw { code: 'http_' + res.status };
      const { text } = await res.json();
      data = JSON.parse(String(text).replace(/^```(?:json)?\s*|\s*```$/g, ''));
    } else { throw { code: 'unavailable' }; }
    if (!data || !Array.isArray(data.movimentos)) throw { code: 'formato' };
    rec.resultado.leitura = data;
    S.leitura[id] = { st: 'done' };
    try { await store.updateLeitura?.(id, data); } catch (e) { /* a leitura fica na tela mesmo sem salvar */ }
  } catch (e) {
    S.leitura[id] = { st: 'fail', code: e && e.code };
  }
  patchLeitura(rec);
}

function patchLeitura(rec) {
  const box = $('#leitura-box');
  if (box && S.result && S.result.id === rec.id) box.innerHTML = leituraHTML(rec);
}

function leituraHTML(rec) {
  const L = rec.resultado.leitura;
  const st = S.leitura[rec.id]?.st;
  const statusChip = s => { const m = { presente: ['Presente', 'var(--good)'], parcial: ['Parcial', 'var(--warn)'], ausente: ['Não aparece', 'var(--crit)'] }[s] || ['—', 'var(--ink-3)']; return `<span class="chip" style="border-color:color-mix(in srgb, ${m[1]} 50%, transparent)"><i class="swatch" style="background:${m[1]}"></i>${m[0]}</span>`; };
  if (L) {
    return `<p>${esc(L.sintese)}</p>
      <div class="mov-list">${L.movimentos.map(m => `<div class="mov"><div class="mov-head"><strong>${esc(m.nome)}</strong>${statusChip(m.status)}</div><p class="muted small">${esc(m.evidencia)}</p><p class="small"><b>Como fortalecer:</b> ${esc(m.como_fortalecer)}</p></div>`).join('')}</div>
      ${L.quem_decide ? `<p class="small"><b>Quem decide:</b> ${esc(L.quem_decide)}</p>` : ''}
      ${L.postura ? `<p class="small"><b>Postura:</b> ${esc(L.postura)}</p>` : ''}
      ${L.ponto_chave ? `<div class="key-point"><span class="eyebrow">Ponto-chave</span><p>${esc(L.ponto_chave)}</p></div>` : ''}
      <p class="muted small">Leitura gerada por IA a partir do seu relato. Use como ponto de partida para a sua própria reflexão.</p>`;
  }
  if (st === 'loading') return `<p class="muted"><span class="dots" aria-hidden="true"></span> Lendo a sua história com base nos quatro movimentos…</p>`;
  const guide = `<p class="muted small">Releia a sua história com estas quatro perguntas:</p>
    <ul class="guide"><li><b>Espelho:</b> você perguntou e aprofundou antes de apresentar o serviço?</li><li><b>Virada:</b> o cliente ouviu algo novo sobre o próprio problema?</li><li><b>Custo:</b> ficou claro quanto custa deixar como está?</li><li><b>Caminho:</b> houve uma recomendação clara e um próximo passo combinado?</li></ul>`;
  if (st === 'fail' && S.leitura[rec.id].code !== 'unavailable') return `${guide}<p class="small muted">A leitura automática não foi concluída agora. <button class="link-btn" data-act="ler-historia">Tentar de novo</button></p>`;
  return guide;
}

function sinaisHTML(r) {
  const s = r.sinais;
  if (!s) return '';
  const dims = Object.entries(s.porDim || {}).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const linhas = [];
  linhas.push(`<p>Você levou em média <b class="tnum">${String(s.medianaSeg).replace('.', ',')} s</b> por afirmação e trocou de resposta em <b class="tnum">${s.trocas.length}</b> ${s.trocas.length === 1 ? 'pergunta' : 'perguntas'}.</p>`);
  if (s.rapido) linhas.push('<p class="muted">Esse ritmo é bastante rápido. Respostas muito rápidas podem refletir uma leitura apressada. Se for o caso, vale refazer o diagnóstico com mais calma.</p>');
  if (dims.length) {
    linhas.push(`<p>As hesitações e trocas se concentraram em: ${dims.map(([d, n]) => `<span class="chip"><b>${DIM[d].nome}</b> ${n} sinais</span>`).join(' ')}</p>`);
    linhas.push('<p class="muted">Nesses temas, a resposta pediu mais reflexão. Vale observar se é aí que surgem as suas dúvidas também na conversa real com o cliente.</p>');
  } else {
    linhas.push('<p class="muted">O ritmo foi constante, sem concentração de hesitação em nenhuma dimensão.</p>');
  }
  if (s.interrupcoes) linhas.push(`<p class="muted small">${s.interrupcoes} ${s.interrupcoes === 1 ? 'pausa longa foi desconsiderada' : 'pausas longas foram desconsideradas'} no cálculo.</p>`);
  return `<div class="card stack" style="gap:12px"><div><h2 class="h-sec" style="margin:0">Sinais de resposta</h2><span class="tag" style="display:inline-block;margin-top:8px">Visível só para o facilitador</span></div>${linhas.join('')}<p class="muted small">Os sinais comparam cada pergunta com o seu próprio ritmo e ficam fora do Índice OQGCI.</p></div>`;
}

/* ---------- Elementos visuais do relatório ---------- */
function gauge(v) {
  // Semicírculo de 0 a 100 com as quatro faixas de nível e o marcador do índice.
  const cx = 150, cy = 140, R = 112, W = 18;
  const pt = (val, rad) => { const a = Math.PI * (1 - val / 100); return [cx + rad * Math.cos(a), cy - rad * Math.sin(a)]; };
  const arc = (a, b, op) => { const [x1, y1] = pt(a, R); const [x2, y2] = pt(b, R); return `<path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2}" fill="none" stroke="var(--accent)" stroke-opacity="${op}" stroke-width="${W}"/>`; };
  const segs = [[0, 39.4, .18], [40.6, 59.4, .38], [60.6, 79.4, .62], [80.6, 100, .95]].map(([a, b, o]) => arc(a, b, o)).join('');
  const [mx, my] = pt(v, R);
  const ticks = [40, 60, 80].map(t => { const [x1, y1] = pt(t, R + W / 2 + 3); const [x2, y2] = pt(t, R + W / 2 + 9); const [lx, ly] = pt(t, R + W / 2 + 20); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink-3)" stroke-width="1"/><text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">${t}</text>`; }).join('');
  return `<svg viewBox="0 0 300 170" role="img" aria-label="Índice OQGCI ${v} de 100, nível ${levelOf(v).nome}" class="gauge">${segs}${ticks}
    <circle cx="${mx}" cy="${my}" r="12" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/>
    <text x="${cx}" y="${cy - 18}" text-anchor="middle" font-size="58" font-weight="300" fill="var(--ink)" font-family="Urbanist, sans-serif">${v}</text>
    <text x="${cx}" y="${cy + 6}" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace" letter-spacing="1.5">DE 100</text></svg>`;
}

const QUADS = {
  conduz: { nome: 'Conduz a decisão', linhas: ['Conduz a', 'decisão'], t: 'O cliente enxerga o ganho e recebe ajuda para decidir.' },
  encanta: { nome: 'Encanta e não fecha', linhas: ['Encanta e', 'não fecha'], t: 'O cliente se interessa, mas a decisão fica para depois.' },
  pressiona: { nome: 'Conduz sem conectar', linhas: ['Conduz sem', 'conectar'], t: 'Há firmeza para decidir, mas o cliente ainda não enxerga o ganho.' },
  vitrine: { nome: 'Na vitrine', linhas: ['Na vitrine'], t: 'A conversa ainda gira em torno do serviço.' }
};
const quadOf = r => r.aprox >= 60 ? (r.afast >= 60 ? 'conduz' : 'encanta') : (r.afast >= 60 ? 'pressiona' : 'vitrine');

function oqgciMap(r) {
  // Mapa 2x2: Aproximação no eixo horizontal, Afastamento no vertical, limite em 60.
  const L = 44, T = 16, S = 236;
  const X = v => L + v / 100 * S, Y = v => T + (100 - v) / 100 * S;
  const q = quadOf(r);
  const cell = (key, x, y, w, h, lx, ly, anchor) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${q === key ? 'var(--accent)' : 'var(--surface-2)'}" fill-opacity="${q === key ? .16 : .55}"/>
    <text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="11" font-weight="${q === key ? 700 : 500}" fill="${q === key ? 'var(--ink)' : 'var(--ink-3)'}" font-family="Manrope, sans-serif">${QUADS[key].linhas.map((t, i) => `<tspan x="${lx}" dy="${i ? 13 : 0}">${t}</tspan>`).join('')}</text>`;
  const x60 = X(60), y60 = Y(60);
  return `<svg viewBox="0 0 300 300" role="img" aria-label="Mapa OQGCI: ${QUADS[q].nome}" class="map2x2">
    ${cell('encanta', x60, y60, L + S - x60, T + S - y60, L + S - 6, T + S - 21, 'end')}
    ${cell('conduz', x60, T, L + S - x60, y60 - T, L + S - 6, T + 16, 'end')}
    ${cell('vitrine', L, y60, x60 - L, T + S - y60, L + 6, T + S - 8, 'start')}
    ${cell('pressiona', L, T, x60 - L, y60 - T, L + 6, T + 16, 'start')}
    <line x1="${x60}" y1="${T}" x2="${x60}" y2="${T + S}" stroke="var(--line)" stroke-dasharray="3 3"/><line x1="${L}" y1="${y60}" x2="${L + S}" y2="${y60}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <rect x="${L}" y="${T}" width="${S}" height="${S}" fill="none" stroke="var(--line)"/>
    <text x="${L + S / 2}" y="${T + S + 30}" text-anchor="middle" font-size="11.5" fill="var(--c-warm)" font-family="Manrope, sans-serif" font-weight="700">Aproximação →</text>
    <text transform="translate(${L - 24} ${T + S / 2}) rotate(-90)" text-anchor="middle" font-size="11.5" fill="var(--cool)" font-family="Manrope, sans-serif" font-weight="700">Afastamento →</text>
    <text x="${L}" y="${T + S + 14}" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">0</text><text x="${x60}" y="${T + S + 14}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">60</text><text x="${L + S}" y="${T + S + 14}" text-anchor="end" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">100</text>
    <circle cx="${X(r.aprox)}" cy="${Y(r.afast)}" r="9" fill="var(--accent)" stroke="var(--bg)" stroke-width="3"><title>Aproximação ${r.aprox}, Afastamento ${r.afast}</title></circle>
  </svg>`;
}

function levelMeter(v, color, label) {
  return `<div class="lvl-meter" role="img" aria-label="${label}: ${v} de 100"><div class="lvl-track"><i style="width:${Math.max(2, v)}%;background:${color}"></i><span style="left:40%"></span><span style="left:60%"></span><span style="left:80%"></span></div></div>`;
}

  }).join('');

  const hasHist = Boolean(rec.respostas?.historia);
  const historia = hasHist ? `<div class="card stack" style="gap:14px"><h2 class="h-sec" style="margin:0">Sua história de venda</h2>

/* ---------- Relatório em PDF ---------- */
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
function loadJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf);
  return new Promise((ok, fail) => {
    const s = document.createElement('script'); s.src = JSPDF_URL; s.async = true;
    s.onload = () => window.jspdf ? ok(window.jspdf) : fail(new Error('jspdf'));
    s.onerror = () => fail(new Error('Não foi possível carregar o gerador de PDF. Verifique a conexão.'));
    document.head.appendChild(s);
  });
}
// As fontes padrão do PDF cobrem os acentos do português; aspas curvas e símbolos viram equivalentes simples.
const pdfText = t => String(t ?? '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/[–—]/g, '-').replace(/·/g, '-').replace(/…/g, '...').replace(/→/g, '->').replace(/[✓●]/g, '').replace(/­/g, '').replace(/[^\x00-\xFF]/g, '');

async function buildPDF(rec) {
  const { jsPDF } = await loadJsPDF();
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const r = rec.resultado; const p = PROFILES[r.perfil]; const lvl = levelOf(r.indice); const voc = vocabOf(rec.respostas?.negocio);
  const W = 210, M = 16, CW = W - 2 * M, BOTTOM = 280;
  const C = { ink: [27, 26, 34], ink2: [88, 84, 100], ink3: [130, 126, 144], line: [222, 219, 228], warm: [194, 131, 30], cool: [74, 139, 220], third: [194, 85, 159], dark: [15, 14, 20], soft: [248, 245, 240], good: [47, 143, 98], warn: [190, 135, 20], crit: [196, 72, 86] };
  let y = 0;
  const color = (c, kind = 'text') => kind === 'text' ? doc.setTextColor(...c) : kind === 'fill' ? doc.setFillColor(...c) : doc.setDrawColor(...c);
  const font = (size, style = 'normal', c = C.ink) => { doc.setFont('helvetica', style); doc.setFontSize(size); color(c); };
  const lh = size => size * 0.42;
  const footer = () => { const n = doc.getNumberOfPages(); font(8, 'normal', C.ink3); doc.text(pdfText('Diagnóstico OQGCI · neurociência aplicada à venda'), M, 290); doc.text(String(n), W - M, 290, { align: 'right' }); };
  const newPage = () => { footer(); doc.addPage(); y = 18; };
  const need = h => { if (y + h > BOTTOM) newPage(); };
  const para = (t, size = 10, style = 'normal', c = C.ink, width = CW, x = M, gap = 1.5) => {
    font(size, style, c);
    const lines = doc.splitTextToSize(pdfText(t), width);
    for (const ln of lines) { need(lh(size) + 1); doc.text(ln, x, y + lh(size)); y += lh(size) + 0.9; }
    y += gap;
  };
  const h2 = t => { need(28); y += 3; font(13, 'bold', C.ink); doc.text(pdfText(t), M, y + 5); y += 8; color(C.warm, 'draw'); doc.setLineWidth(0.6); doc.line(M, y, M + 14, y); y += 5; };
  const bar = (x, yy, w, h, v, c) => { color(C.line, 'fill'); doc.roundedRect(x, yy, w, h, h / 2, h / 2, 'F'); color(c, 'fill'); doc.roundedRect(x, yy, Math.max(h, w * v / 100), h, h / 2, h / 2, 'F'); color([255, 255, 255], 'draw'); doc.setLineWidth(0.3); [40, 60, 80].forEach(t => doc.line(x + w * t / 100, yy, x + w * t / 100, yy + h)); };
  const eixoRGB = e => e === 'aprox' ? C.warm : e === 'afast' ? C.cool : C.ink2;

  color(C.warm, 'fill'); doc.circle(M + 6, 17, 6, 'F'); color(C.dark, 'fill'); doc.rect(M + 6, 10.8, 6.4, 12.4, 'F');
  color(C.cool, 'fill'); doc.circle(M + 6, 17, 3.8, 'F'); color(C.warm, 'fill'); doc.rect(M + 2.1, 13.1, 3.9, 7.8, 'F');
  font(18, 'bold', [255, 255, 255]); doc.text(pdfText('Diagnóstico OQGCI'), M + 16, 19.5);
  font(9.5, 'normal', [200, 196, 212]); doc.text(pdfText(`Diagnóstico completo${rec.nome ? ' · ' + rec.nome : ''} · ${fmtDate(rec.created_at)}`), M, 34);

  font(10.5, 'bold', C.warm); doc.text(pdfText(`Nível ${lvl.n} · ${lvl.nome}`), M, y + 22);

  const q = quadOf(r);

    font(9.5, 'normal', C.ink); doc.text(pdfText(t), M, y + 3.5); font(9.5, 'bold', C.ink); doc.text(String(v), M + CW, y + 3.5, { align: 'right' });
    bar(M, y + 5.5, CW, 3, v, c); y += 12;
  });
  para(`${QUADS[q].nome}. ${QUADS[q].t}`, 10, 'normal', C.ink);
  font(9, 'normal', C.ink3); doc.text(pdfText(`Postura nas seis situações: ${r.postura.assertiva} assertiva, ${r.postura.passiva} passiva, ${r.postura.agressiva} agressiva.`), M, y + 3); y += 8;

  if (r.alerts.length) {
    h2('Pontos de atenção');
    r.alerts.forEach(a => { need(14); color(a.sev === 'crit' ? C.crit : C.warn, 'fill'); doc.circle(M + 1.6, y + 2.2, 1.6, 'F'); font(10, 'bold', C.ink); doc.text(pdfText(a.t), M + 6, y + 3.4); y += 5.5; para(a.d, 9.5, 'normal', C.ink2, CW - 6, M + 6, 2); });
  }

  // Dimensões
  h2('As oito dimensões');
  DIMS.forEach(d => {
    need(9); const v = r.dims[d.id];
    font(9.5, 'bold', C.ink); doc.text(pdfText(`${d.id} ${d.nome}`), M, y + 3.4);
    bar(M + 40, y + 1, CW - 72, 3.2, v, eixoRGB(d.eixo));

  h2('Leitura das dimensões');
  const items = rec.respostas?.items;
  DIMS.forEach(d => {
    const v = r.dims[d.id]; need(30);

    para(V(BANDS[d.id][bandOf(v)], voc), 9.5, 'normal', C.ink, CW, M, 1);

    }
    para(`Por que importa: ${V(d.mecanismo, voc)}`, 8.5, 'italic', C.ink3, CW, M, 4);
  });

  h2('Sua postura nas situações');
  const sjt = rec.respostas?.sjt || {};
  SJT.forEach((s, k) => {
    const ch = sjt[s.id]; const mine = s.ops.find(o => o.k === ch); const best = s.ops.find(o => o.k === 'assertiva');
    need(18); font(10, 'bold', C.ink); const tl = doc.splitTextToSize(pdfText(`${k + 1}. ${V(s.t, voc)}`), CW - 30); doc.text(tl, M, y + 3.6);
    if (ch) { color(ch === 'assertiva' ? C.warm : ch === 'passiva' ? C.cool : C.third, 'fill'); doc.roundedRect(M + CW - 26, y, 26, 5.4, 2.7, 2.7, 'F'); font(8.5, 'bold', [255, 255, 255]); doc.text(pdfText(POSTURA_NOME[ch]), M + CW - 13, y + 3.8, { align: 'center' }); }
    y += tl.length * 4.6 + 1.5;
    if (mine) para(`Sua resposta: ${V(mine.t, voc)}`, 9, 'normal', C.ink2, CW, M, 0.5);
    if (ch && ch !== 'assertiva') para(`A resposta que sustenta o valor: ${V(best.t, voc)}`, 9, 'normal', C.ink2, CW, M, 0.5);
    y += 2.5;
  });

  if (rec.respostas?.historia) {

    color(C.soft, 'fill'); const hl = doc.splitTextToSize(pdfText(rec.respostas.historia), CW - 8); const hh = hl.length * 4.4 + 6;
    need(Math.min(hh, 120)); doc.rect(M, y, CW, Math.min(hh, BOTTOM - y), 'F'); color(C.warm, 'fill'); doc.rect(M, y, 1, Math.min(hh, BOTTOM - y), 'F');
    y += 3; para(rec.respostas.historia, 9.5, 'italic', C.ink, CW - 8, M + 5, 3);
    const L = r.leitura;

        need(16); const st = { presente: ['Presente', C.good], parcial: ['Parcial', C.warn], ausente: ['Não aparece', C.crit] }[m.status] || ['-', C.ink3];
        font(10, 'bold', C.ink); doc.text(pdfText(m.nome), M, y + 3.6); color(st[1], 'fill'); doc.circle(M + 26, y + 2.4, 1.4, 'F'); font(9, 'bold', st[1]); doc.text(pdfText(st[0]), M + 29, y + 3.6); y += 6;
        para(m.evidencia, 9, 'normal', C.ink2, CW, M, 0.5); para(`Como fortalecer: ${m.como_fortalecer}`, 9, 'normal', C.ink, CW, M, 2.5);
      });
      if (L.quem_decide) para(`Quem decide: ${L.quem_decide}`, 9.5, 'normal', C.ink, CW, M, 1);

      para('Leitura gerada por IA a partir do relato.', 8, 'italic', C.ink3, CW, M, 2);
    } else {
      para('Releia a sua história com as quatro perguntas: houve Espelho (você perguntou antes de apresentar)? Virada (o cliente ouviu algo novo)? Custo (ficou claro quanto custa deixar como está)? Caminho (recomendação clara e próximo passo)?', 9.5, 'normal', C.ink2);
    }
  }

  h2('Prioridades de desenvolvimento');
  r.prioridades.forEach((k, i) => {
    need(30); font(11, 'bold', C.ink); doc.text(pdfText(`${i + 1}. ${DIM[k].nome}`), M, y + 4); font(10, 'bold', C.warm); doc.text(String(r.dims[k]), M + CW, y + 4, { align: 'right' }); y += 7;
    para('O que está em jogo: ' + V(BANDS[k][bandOf(r.dims[k])], voc), 9.5, 'normal', C.ink2, CW, M, 1);

function setPdfButtons() { document.querySelectorAll('[data-act=pdf]').forEach(b => { b.disabled = S.pdfBusy; b.textContent = S.pdfBusy ? 'Gerando PDF…' : 'Baixar relatório em PDF'; }); }
function pdfName(rec) { return `diagnostico-oqgci-${(rec.nome || 'relatorio').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'relatorio'}-${rec.created_at.slice(0, 10)}.pdf`; }

async function exportPDF(mode) {
  const rec = S.result; if (!rec || S.pdfBusy) return;
  S.pdfBusy = true; setPdfButtons();
  try {
    const blob = await buildPDF(rec);
    const name = pdfName(rec);
    let dl = null;
    try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (mode === 'share' && navigator.canShare) {
      const file = new File([blob], name, { type: 'application/pdf' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Diagnóstico OQGCI', text: 'Meu Diagnóstico OQGCI' }); return; }
    }
    if (dl) { await dl.save({ filename: name, data: blob }); toast('Relatório salvo'); }
    else if (!window.claude) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('PDF baixado');
    } else { toast('O download não está disponível nesta visualização'); }
  } catch (e) {
    if (e && (e.code === 'declined' || e.name === 'AbortError')) { /* a pessoa cancelou */ }
    else toast((e && e.message && e.message.length < 120) ? e.message : 'Não foi possível gerar o PDF agora.');
  } finally { S.pdfBusy = false; setPdfButtons(); }
}

function emailReport() {
  const rec = S.result; if (!rec) return;
  const subject = 'Meu Diagnóstico OQGCI';
  const body = resumoTexto(rec) + '\n\nO relatório completo em PDF pode ser baixado em ' + location.origin + location.pathname + ' (Meu painel > diagnóstico).';
  location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
