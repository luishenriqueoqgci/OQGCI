<title>Diagnóstico OQGCI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: uma coluna central de leitura (max 1080px) sobre fundo tinta-violeta; telas de questionário em cartão único, pensadas primeiro para o celular. */
:root {
  color-scheme: dark;
  --bg: #0F0E14;
  --surface: #18161F;
  --surface-2: #211E2A;
  --line: #2F2B3A;
  --ink: #EFEBF5;
  --ink-2: #B6B0C4;
  --ink-3: #868097;
  --accent: #F0B35E;
  --accent-strong: #F6C77F;
  --accent-ink: #1C1408;
  --cool: #8DB8EE;
  --c-warm: #C2831E;
  --c-cool: #4A8BDC;
  --c-third: #C2559F;
  --good: #5FBF8F;
  --warn: #E8B44A;
  --crit: #E4707A;
  --font-display: "Urbanist", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  --r-sm: 10px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
}
a { color: var(--accent); text-underline-offset: 3px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0; }
.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.narrow { max-width: 720px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.tnum { font-variant-numeric: tabular-nums; }

/* Barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand span { white-space: nowrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: 0.01em; }
.brand svg { flex: none; }
.nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.nav button, .nav a { background: none; border: 0; color: var(--ink-2); font-size: 14px; font-weight: 600; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-decoration: none; }
.nav button:hover, .nav a:hover { color: var(--ink); background: var(--surface); }
.demo-strip { background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.demo-strip .wrap { padding-block: 8px; display: flex; gap: 8px; align-items: center; }
.demo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; padding: 14px 26px; font-weight: 700; font-size: 15px; letter-spacing: 0.04em; cursor: pointer; border: 1px solid transparent; text-decoration: none; transition: transform .15s ease, background-color .15s ease, border-color .15s ease; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: linear-gradient(180deg, var(--accent-strong), var(--accent)); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-strong); }
.btn-ghost { background: transparent; color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-quiet { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.btn-quiet:hover { border-color: var(--ink-3); }
.btn-sm { padding: 9px 16px; font-size: 14px; letter-spacing: 0.02em; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link-btn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* Landing */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero::before { content: ""; position: absolute; inset: -20% -10% auto -10%; height: 140%; background:
  radial-gradient(40% 50% at 22% 40%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
  radial-gradient(38% 46% at 82% 55%, color-mix(in srgb, var(--cool) 16%, transparent), transparent 70%);
  pointer-events: none; }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.9fr); gap: 48px; align-items: center; padding-block: 72px 64px; }
.pill { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 999px; padding: 8px 16px; }
.hero h1 { font-weight: 300; font-size: clamp(38px, 6vw, 64px); line-height: 1.04; margin-top: 24px; }
.hero h1 .gold { display: block; font-weight: 600; color: var(--accent); }
.hero .lead { font-size: 18px; color: var(--ink-2); max-width: 34em; margin-top: 22px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; align-items: center; }
.ref-link { display: inline-flex; gap: 8px; align-items: center; margin-top: 22px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); background: none; border: 0; cursor: pointer; padding: 4px 0; }
.ref-link:hover { color: var(--ink); }

.sample { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: 0 30px 80px -40px rgba(0,0,0,.8); }
.sample-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); border: 1px dashed var(--line); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.big-num { font-family: var(--font-display); font-weight: 300; font-size: 72px; line-height: 1; letter-spacing: -0.03em; }
.big-num small { font-size: 22px; color: var(--ink-3); font-weight: 400; margin-left: 4px; }
.level-chip { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 5px 12px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-strong); font-weight: 700; font-size: 13px; }

.section { padding-block: 64px; border-bottom: 1px solid var(--line); }
.section-head { display: grid; gap: 10px; margin-bottom: 32px; max-width: 46em; }
.section-head h2 { font-size: clamp(26px, 3.4vw, 36px); }
.axis-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.axis-col { border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; align-content: start; background: var(--surface); }
.axis-col h3 { font-size: 20px; display: flex; gap: 10px; align-items: center; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.dim-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.dim-code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); padding-top: 3px; }
.dim-row strong, .base-band strong { display: block; font-weight: 700; }
.base-band { margin-top: 16px; border: 1px solid var(--line); border-radius: var(--r); padding: 20px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 10%, var(--surface)), color-mix(in srgb, var(--cool) 8%, var(--surface))); display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; counter-reset: s; }
.step { border-top: 1px solid var(--accent); padding-top: 16px; display: grid; gap: 8px; }
.step-n { font-family: var(--font-mono); font-size: 12px; color: var(--accent); letter-spacing: 0.12em; }
.step h3 { font-size: 20px; }
.who { display: flex; flex-wrap: wrap; gap: 8px; }
.who span { border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; color: var(--ink-2); font-size: 14px; background: var(--surface); }
.foot { padding-block: 40px 56px; color: var(--ink-3); font-size: 14px; }
.foot .wrap { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; }

/* Formulários e cartões */
.page { padding-block: 40px 72px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; }
.stack { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.stack-lg { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.field input[type=text], .field input[type=email], .field input[type=password] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 13px 14px; font-size: 16px; }
.field input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.check { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 10px; font-size: 14px; color: var(--ink-2); align-items: start; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { border: 0; background: none; padding: 10px; border-radius: 999px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.tabs button[aria-selected=true] { background: var(--surface-2); color: var(--ink); }
.msg { border-radius: var(--r-sm); padding: 12px 14px; font-size: 14px; border: 1px solid var(--line); background: var(--bg); }
.msg-err { border-color: color-mix(in srgb, var(--crit) 55%, transparent); color: #F4B9BF; }
.msg-ok { border-color: color-mix(in srgb, var(--good) 55%, transparent); color: #BFE8D2; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 13px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* Questionário */
.quiz { max-width: 640px; margin: 0 auto; padding-block: 28px 64px; }
.progress { display: grid; gap: 8px; margin-bottom: 22px; }
.progress-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-3); font-family: var(--font-mono); letter-spacing: 0.06em; }
.bar { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .25s ease; }
.q-text { font-family: var(--font-display); font-size: clamp(22px, 4.6vw, 28px); line-height: 1.28; font-weight: 500; min-height: 3.9em; }
.q-hint { margin-top: 10px; color: var(--ink-3); font-size: 14px; }
.opts { display: grid; gap: 10px; margin-top: 24px; }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px 16px; cursor: pointer; transition: border-color .12s ease, background-color .12s ease; }
.opt:hover { border-color: var(--ink-3); }
.opt[aria-pressed=true] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.opt-k { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); color: var(--ink-2); }
.opt[aria-pressed=true] .opt-k { background: var(--accent); color: var(--accent-ink); }
.opt-t { font-weight: 600; }
.quiz-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 12px; }
.scene { border-left: 2px solid var(--cool); padding-left: 16px; }

/* Relatório */
.report-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: stretch; }
.score-card { display: grid; gap: 14px; align-content: start; }
.profile-card h2 { font-size: 30px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.h-sec { font-size: 22px; margin-bottom: 14px; }
.alert { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--bg); border: 1px solid var(--line); }
.alert-ico { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.alert.warn .alert-ico { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.alert.crit .alert-ico { background: color-mix(in srgb, var(--crit) 22%, transparent); color: var(--crit); }
.alert strong { display: block; }
.meter { display: grid; gap: 6px; }
.meter-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.meter-track { height: 10px; background: var(--surface-2); border-radius: 6px; position: relative; overflow: hidden; }
.meter-track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
.stackbar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--surface); }
.stackbar > i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; gap: 8px; align-items: center; }
.prio { display: grid; gap: 10px; }
.prio-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.prio dl { margin: 0; display: grid; gap: 8px; }
.prio dt { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.prio dd { margin: 0; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 8px; align-items: center; border-radius: 999px; padding: 6px 12px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; }
.chip b { font-variant-numeric: tabular-nums; }
.weeks { display: grid; gap: 0; counter-reset: w; }
.week { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; padding-block: 14px; border-top: 1px solid var(--line); }
.week:first-child { border-top: 0; }
.week-n { font-family: var(--font-mono); font-size: 12px; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; padding-top: 3px; }
.questions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.question { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 16px; background: var(--bg); display: grid; gap: 8px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--font-mono); font-weight: 500; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); background: var(--surface); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.heat td.cell { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* Painéis */
.hello { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; }
.list { display: grid; gap: 10px; }
.row-btn { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px 16px; cursor: pointer; }
.row-btn:hover { border-color: var(--ink-3); }
.row-meta { color: var(--ink-3); font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 16px; display: grid; gap: 4px; }
.kpi b { font-family: var(--font-display); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi span { font-size: 13px; color: var(--ink-3); }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: 128px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 14px; }
.hbar-track { height: 14px; background: var(--surface-2); border-radius: 4px; position: relative; }
.hbar-track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--c-warm); }
.hbar > span:first-child { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.hbar .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.flag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-strong); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.turma-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.turma-chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.turma-chips button[aria-pressed=true] { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.inline-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.inline-form .field { flex: 1 1 240px; }
.code-box { font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.12em; color: var(--accent-strong); }
.refs { display: grid; gap: 18px; }
.ref-group { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.ref-group ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; color: var(--ink-2); font-size: 15px; }
.ev { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--ink-3); }
.install { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface-2); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.install .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.toast { position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); max-width: calc(100vw - 32px); text-align: center; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 40; }
.radar-wrap svg { width: 100%; height: auto; display: block; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 28px; text-align: center; color: var(--ink-2); display: grid; gap: 12px; justify-items: center; }

@media (max-width: 860px) {
  .hero .wrap, .report-hero, .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .hero .wrap { padding-block: 48px 44px; gap: 36px; }
  .steps, .grid-3 { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ref-group { grid-template-columns: minmax(0, 1fr); gap: 10px; }
}
@media (max-width: 600px) {
  .axis-grid, .questions { grid-template-columns: minmax(0, 1fr); }
  .hbar { grid-template-columns: 96px minmax(0, 1fr) 36px; }
  .week { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .btn { width: 100%; }
  .cta-row .btn, .actions .btn { width: 100%; }
  .inline-form .btn { width: 100%; }
  .nav .hide-sm { display: none; }
  .brand { font-size: 16px; gap: 8px; }
  .nav { gap: 2px; flex-wrap: nowrap; }
  .nav button, .nav a { padding: 8px 7px; font-size: 13px; }
  .card { padding: 18px; }
}
@media (max-width: 440px) { .hide-xs { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print {
  .top, .demo-strip, .install, .actions, .no-print { display: none !important; }
  html, body { background: #fff; color: #111; }
  .card, .kpi, .question, .alert { background: #fff; border-color: #ccc; color: #111; }
  .muted, .row-meta { color: #444; }
}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';

/* ============================== CONFIGURAÇÃO ============================== */
const CONFIG = window.OQGCI_CONFIG || {};

const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
const r0 = v => Math.round(v);

function scoreAnswers(items, sjt) {
  const dims = {};
  let d8Items = 0;
  for (const d of DIMS) {
    const vals = ITEMS.filter(i => i.d === d.id).map(i => i.inv ? 6 - items[i.c] : items[i.c]);
    dims[d.id] = (avg(vals) - 1) / 4 * 100;
  }
  d8Items = dims.D8;
  const postura = { passiva: 0, assertiva: 0, agressiva: 0 };
  for (const s of SJT) postura[sjt[s.id]] += 1;
  const pctAssert = postura.assertiva / SJT.length * 100;
  dims.D8 = 0.7 * d8Items + 0.3 * pctAssert;

  const aprox = avg(['D2', 'D3', 'D4', 'D7'].map(k => dims[k]));
  const afast = avg(['D5', 'D6', 'D8'].map(k => dims[k]));
  const indice = avg(DIMS.map(d => dims[d.id]));

  const alerts = [];
  const base = dims.D1 < 50 || sjt.S6 !== 'assertiva';
  if (base) alerts.push({ k: 'base', sev: 'crit', t: 'Base frágil', d: 'A técnica sem a linha de base reduz a sinceridade percebida pelo cliente. Propósito passa a ser a sua primeira prioridade.' });
  if (postura.agressiva >= 2) alerts.push({ k: 'pressao', sev: 'crit', t: 'Pressão', d: 'Em duas ou mais situações, a sua resposta pressiona o cliente. Sob pressão, ele entra em modo de defesa e decide pior.' });
  if (postura.passiva >= 3) alerts.push({ k: 'concessao', sev: 'warn', t: 'Concessão', d: 'Em três ou mais situações, o valor do seu trabalho cede antes de o cliente pedir.' });
  if (aprox - afast >= 20) alerts.push({ k: 'deseq', sev: 'warn', t: 'Desequilíbrio OQGCI', d: 'O cliente percebe o ganho e adia a decisão. Fortaleça Custo, Caminho e Condução.' });
  if (afast - aprox >= 20) alerts.push({ k: 'deseq', sev: 'warn', t: 'Desequilíbrio OQGCI', d: 'O cliente sente a urgência e ainda não enxerga o ganho. Fortaleça Presença, Espelho, Virada e Quem decide.' });

  const has = k => alerts.some(a => a.k === k);
  const minDim = Math.min(...DIMS.map(d => dims[d.id]));
  let perfil = 'desenvolvimento';
  if (has('pressao') || (d8Items >= 60 && dims.D1 < 50)) perfil = 'insistente';
  else if (indice < 45) perfil = 'reativo';
  else if (dims.D1 >= 65 && dims.D3 >= 65 && avg([dims.D4, dims.D5, dims.D6]) < 55 && has('concessao')) perfil = 'prestativo';
  else if ((dims.D2 >= 60 || dims.D4 >= 60) && dims.D3 < 50) perfil = 'especialista';
  else if (indice >= 70 && minDim >= 55 && postura.assertiva >= 4) perfil = 'conselheiro';

  const sorted = DIMS.map(d => d.id).sort((a, b) => dims[a] - dims[b]);
  let prioridades = sorted.slice(0, 3);
  if (base && !prioridades.includes('D1')) prioridades = ['D1', ...prioridades.slice(0, 2)];
  else if (base) prioridades = ['D1', ...prioridades.filter(x => x !== 'D1')];
  const forcas = sorted.slice().reverse().filter(x => !prioridades.includes(x)).slice(0, 3);

  const round = {};
  for (const k in dims) round[k] = r0(dims[k]);
  return {
    v: 1,
    dims: round,
    indice: r0(indice), aprox: r0(aprox), afast: r0(afast),
    nivel: levelOf(r0(indice)).nome,
    postura, perfil, alerts, prioridades, forcas
  };
}

    for (const d of DIMS) {
      const its = ITEMS.filter(i => i.d === d.id);
      its.forEach((it, k) => {
        let v = Math.min(5, Math.max(1, Math.round(means[d.id] + offs[k % offs.length])));
        items[it.c] = it.inv ? 6 - v : v;
      });
    }
    const sjt = {};
    SJT.forEach((s, k) => { sjt[s.id] = sjtPattern[k]; });
    const resultado = scoreAnswers(items, sjt);
    return { id: 'ex-' + n, user_id: 'ex-user-' + n, nome: 'Exemplo ' + n, turma_id: 'turma-exemplo', respostas: { items, sjt }, resultado, created_at: new Date(now - n * 86400000 * 0.7).toISOString(), exemplo: true };
  };
  const A = 'assertiva', P = 'passiva', G = 'agressiva';
  const all = v => Object.fromEntries(DIMS.map(d => [d.id, v]));
  return [
    mk(1, all(4.6), [A, A, A, A, A, A]),
    mk(2, { D1: 4.7, D2: 3.4, D3: 4.5, D4: 2.6, D5: 2.2, D6: 2.6, D7: 3.2, D8: 2.8 }, [P, P, P, A, A, A]),
    mk(3, { D1: 3.6, D2: 4.3, D3: 2.5, D4: 4.1, D5: 3.3, D6: 3.4, D7: 3.0, D8: 3.4 }, [A, A, P, A, G, A]),
    mk(4, { D1: 2.3, D2: 3.4, D3: 3.0, D4: 3.3, D5: 3.8, D6: 3.9, D7: 3.1, D8: 4.3 }, [G, G, A, G, A, A]),
    mk(5, all(2.3), [P, P, A, P, A, A]),
    mk(6, { D1: 3.8, D2: 3.1, D3: 3.6, D4: 3.0, D5: 3.2, D6: 3.5, D7: 2.8, D8: 3.4 }, [A, A, A, P, A, A]),
    mk(7, { D1: 4.4, D2: 4.0, D3: 4.3, D4: 3.9, D5: 3.7, D6: 4.2, D7: 3.9, D8: 4.0 }, [A, A, A, A, P, A]),
    mk(8, { D1: 4.1, D2: 2.9, D3: 4.0, D4: 3.1, D5: 2.9, D6: 3.0, D7: 3.6, D8: 3.0 }, [P, A, P, A, A, A])
  ];
}

function LiveStore() {
  let sb = null;
  let profileCache = null;
  const toRec = r => ({ id: r.id, user_id: r.user_id, nome: r.profiles?.nome || '', turma_id: r.turma_id, respostas: r.respostas, resultado: r.resultado, created_at: r.created_at });
  const errPt = e => {
    const m = (e && e.message) || '';
    if (/Invalid login credentials/i.test(m)) return new Error('E-mail ou senha não conferem. Confira os dados ou crie uma conta.');
    if (/Email not confirmed/i.test(m)) return new Error('Confirme o seu e-mail pelo link que enviamos antes de entrar.');
    if (/already registered/i.test(m)) return new Error('Já existe uma conta com este e-mail. Use a aba Entrar.');
    if (/Password should be at least/i.test(m)) return new Error('A senha precisa ter pelo menos 6 caracteres.');
    if (/rate limit/i.test(m)) return new Error('Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente de novo.');
    return new Error(m || 'Não foi possível concluir. Verifique a conexão e tente de novo.');
  };
  async function profile() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { profileCache = null; return null; }
    if (profileCache && profileCache.id === session.user.id) return profileCache;
    const { data } = await sb.from('profiles').select('id, nome, email, role').eq('id', session.user.id).maybeSingle();
    profileCache = data || { id: session.user.id, nome: session.user.user_metadata?.nome || '', email: session.user.email, role: 'respondente' };
    return profileCache;
  }
  return {
    mode: 'live',
    async init(onRecovery) {
      const mod = await import(SUPABASE_ESM);
      sb = mod.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
      sb.auth.onAuthStateChange((ev) => { profileCache = null; if (ev === 'PASSWORD_RECOVERY' && onRecovery) onRecovery(); });
    },
    getSession: profile,
    async signUp({ nome, email, senha }) {
      const { data, error } = await sb.auth.signUp({ email: email.trim(), password: senha, options: { data: { nome: nome.trim() }, emailRedirectTo: location.origin + location.pathname } });
      if (error) throw errPt(error);
      return { user: data.session ? await profile() : null, needsConfirm: !data.session };
    },
    async signIn({ email, senha }) {
      const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: senha });
      if (error) throw errPt(error);
      return profile();
    },
    async resetPassword(email) {
      const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.origin + location.pathname });
      if (error) throw errPt(error);
      return {};
    },
    async updatePassword(senha) { const { error } = await sb.auth.updateUser({ password: senha }); if (error) throw errPt(error); },
    async signOut() { await sb.auth.signOut(); profileCache = null; },
    async findTurma(codigo) { const { data, error } = await sb.rpc('turma_por_codigo', { p_codigo: codigo.trim() }); if (error) throw errPt(error); return (data && data[0]) || null; },
    async saveResult({ turma_id, respostas, resultado }) {
      const p = await profile();
      const { data, error } = await sb.from('resultados').insert({ user_id: p.id, turma_id: turma_id || null, respostas, resultado, indice: resultado.indice, nivel: resultado.nivel, perfil: resultado.perfil }).select('*, profiles(nome)').single();
      if (error) throw errPt(error);
      return toRec(data);
    },
    async myResults() {
      const p = await profile();
      const { data, error } = await sb.from('resultados').select('*, profiles(nome)').eq('user_id', p.id).order('created_at', { ascending: false });
      if (error) throw errPt(error); return data.map(toRec);
    },
    async getResult(id) { const { data, error } = await sb.from('resultados').select('*, profiles(nome)').eq('id', id).maybeSingle(); if (error) throw errPt(error); return data ? toRec(data) : null; },
    async listTurmas() { const { data, error } = await sb.from('turmas').select('*').order('created_at', { ascending: false }); if (error) throw errPt(error); return data; },
    async createTurma(nome) {
      for (let i = 0; i < 4; i++) {
        const { data, error } = await sb.from('turmas').insert({ nome: nome.trim(), codigo: genCode() }).select().single();
        if (!error) return data;
        if (!/duplicate/i.test(error.message)) throw errPt(error);
      }
      throw new Error('Não foi possível gerar um código único. Tente de novo.');
    },
    async turmaResults(turmaId) {
      let q = sb.from('resultados').select('*, profiles(nome)').order('created_at', { ascending: false });
      if (turmaId === 'sem') q = q.is('turma_id', null); else if (turmaId !== 'todos') q = q.eq('turma_id', turmaId);
      const { data, error } = await q; if (error) throw errPt(error); return data.map(toRec);
    }
  };
}

function go(route) {
  if (location.hash.slice(1) !== route) { location.hash = route; } else { route_(); }

async function route_() {
  let r = location.hash.slice(1) || 'inicio';
  if (!ROUTES.includes(r)) r = 'inicio';
  if (PRIVATE.includes(r) && !S.session) { S.authMsg = null; r = 'entrar'; }
  if (r === 'facilitador' && S.session?.role !== 'facilitador') r = 'painel';
  if (r === 'resultado' && !S.result) r = 'painel';
  if (r === 'entrar' && S.session) r = 'painel';
  if (r === 'nova-senha' && !LIVE) r = 'entrar';
  S.route = r;
  if (r === 'painel') { S.myResults = null; render(); try { S.myResults = await store.myResults(); } catch (e) { S.myResults = []; } }
  if (r === 'facilitador') { await loadFac(); }
  if (r === 'diagnostico' && !S.quiz) startQuiz();
  render();
  window.scrollTo(0, 0);
}

async function quizFinish() {
  const q = S.quiz;
  if (Object.keys(q.items).length < ITEMS.length || Object.keys(q.sjt).length < SJT.length) {
    const miss = ITEMS.findIndex(i => q.items[i.c] == null);
    q.step = miss >= 0 ? miss + 1 : ITEMS.length + SJT.findIndex(s => !q.sjt[s.id]) + 1; render(); toast('Falta responder esta pergunta'); return;
  }
  S.busy = true; render();
  const resultado = scoreAnswers(q.items, q.sjt);

    const rec = await store.saveResult({ turma_id: q.turma?.id, respostas: { items: q.items, sjt: q.sjt }, resultado });

  } catch (e) { S.busy = false; render(); toast(e.message || 'Não foi possível salvar. Tente de novo.'); }
}

/* =============================== RELATÓRIO ================================ */
function radar(dims) {
  const cx = 200, cy = 178, R = 118;
  const order = ['D1', 'D2', 'D3', 'D4', 'D7', 'D5', 'D6', 'D8'];
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / order.length;
  const pt = (i, v) => [cx + Math.cos(ang(i)) * R * v / 100, cy + Math.sin(ang(i)) * R * v / 100];
  const rings = [25, 50, 75, 100].map(v => `<polygon points="${order.map((_, i) => pt(i, v).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');
  const spokes = order.map((_, i) => { const [x, y] = pt(i, 100); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; }).join('');
  const poly = order.map((k, i) => pt(i, dims[k]).join(',')).join(' ');
  const dots = order.map((k, i) => { const [x, y] = pt(i, dims[k]); return `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>${DIM[k].nome}: ${dims[k]}</title></circle>`; }).join('');
  const labels = order.map((k, i) => {
    const [x, y] = pt(i, 100); const a = ang(i); const c = Math.cos(a);
    const lx = x + Math.cos(a) * 16, ly = y + Math.sin(a) * 16 + 4;
    const anchor = Math.abs(c) < 0.2 ? 'middle' : c > 0 ? 'start' : 'end';
    const col = DIM[k].eixo === 'aprox' ? 'var(--c-warm)' : DIM[k].eixo === 'afast' ? 'var(--cool)' : 'var(--ink-2)';
    return `<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="12.5" fill="var(--ink-2)" font-family="Manrope, sans-serif"><tspan fill="${col}">●</tspan> ${DIM[k].nome} <tspan font-weight="700" fill="var(--ink)">${dims[k]}</tspan></text>`;
  }).join('');
  const ticks = [50, 100].map(v => { const [x, y] = pt(0, v); return `<text x="${x + 5}" y="${y + 12}" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">${v}</text>`; }).join('');
  return `<svg viewBox="-40 0 480 350" role="img" aria-label="Radar das oito dimensões">${rings}${spokes}<polygon points="${poly}" fill="var(--accent)" fill-opacity=".16" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${dots}${labels}${ticks}</svg>`;
}

function csvOf(results) {
  const head = ['nome', 'data', 'indice', 'nivel', 'perfil', 'aproximacao', 'afastamento', ...DIMS.map(d => d.id + '_' + d.nome), 'assertiva', 'passiva', 'agressiva', 'alertas'];
  const q = v => /[",;\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const rows = results.map(x => { const r = x.resultado; return [x.nome || '', x.created_at.slice(0, 10), r.indice, r.nivel, PROFILES[r.perfil].nome, r.aprox, r.afast, ...DIMS.map(d => r.dims[d.id]), r.postura.assertiva, r.postura.passiva, r.postura.agressiva, r.alerts.map(a => a.t).join(' | ')].map(q).join(','); });
  return [head.map(q).join(','), ...rows].join('\n');
}

function viewFacilitador() {
  const F = S.fac; const res = F.results || []; const turmas = F.turmas || [];
  const selT = turmas.find(t => t.id === F.sel);
  const n = res.length;
  const mean = k => n ? Math.round(avg(res.map(x => x.resultado.dims[k]))) : 0;
  const idxMean = n ? Math.round(avg(res.map(x => x.resultado.indice))) : 0;
  const dimMeans = DIMS.map(d => ({ d, v: mean(d.id) }));
  const low3 = dimMeans.slice().sort((a, b) => a.v - b.v).slice(0, 3).map(x => x.d.id);
  const pCount = {}; res.forEach(x => { pCount[x.resultado.perfil] = (pCount[x.resultado.perfil] || 0) + 1; });
  const pList = Object.keys(PROFILES).map(k => ({ k, c: pCount[k] || 0 })).filter(x => x.c > 0).sort((a, b) => b.c - a.c);
  const maxP = Math.max(1, ...pList.map(x => x.c));
  const topP = pList[0] ? PROFILES[pList[0].k].nome : '—';
  const heat = v => `background:color-mix(in srgb, var(--c-warm) ${Math.round(6 + v * 0.6)}%, var(--surface))`;
  const chips = [...turmas.map(t => `<button data-turma="${esc(t.id)}" aria-pressed="${F.sel === t.id}">${esc(t.nome)}</button>`), `<button data-turma="sem" aria-pressed="${F.sel === 'sem'}">Sem turma</button>`, `<button data-turma="todos" aria-pressed="${F.sel === 'todos'}">Todos</button>`].join('');
  const body = n === 0 ? `<div class="empty"><strong>Nenhum diagnóstico nesta turma ainda</strong><span class="small">Passe o código ${selT ? `<b class="code-box" style="font-size:16px">${esc(selT.codigo)}</b>` : 'da turma'} aos participantes. Cada pessoa cria a conta, informa o código no início do diagnóstico e aparece aqui ao terminar.</span></div>` : `
    <div class="kpis">
      <div class="kpi"><b>${n}</b><span>Respondentes</span></div>
      <div class="kpi"><b>${idxMean}</b><span>Índice OQGCI médio</span></div>
      <div class="kpi"><b>${levelOf(idxMean).nome}</b><span>Nível médio</span></div>
      <div class="kpi"><b style="font-size:22px;padding-block:4px">${topP}</b><span>Perfil mais frequente</span></div>
    </div>
    <div class="grid-2">
      <div class="card"><h2 class="h-sec">Média por dimensão</h2><div class="hbars">${dimMeans.map(({ d, v }) => `<div class="hbar" title="${d.nome}: média ${v}"><span>${d.nome}${low3.includes(d.id) ? '<span class="flag">prioridade</span>' : ''}</span><span class="hbar-track"><i style="width:${Math.max(1, v)}%"></i></span><span class="v">${v}</span></div>`).join('')}</div>
        <p class="small muted" style="margin-top:14px">As três dimensões com menor média são as prioridades de capacitação da turma.</p></div>
      <div class="card"><h2 class="h-sec">Distribuição de perfis</h2><div class="hbars">${pList.map(x => `<div class="hbar" title="${PROFILES[x.k].nome}: ${x.c}"><span>${PROFILES[x.k].nome}</span><span class="hbar-track"><i style="width:${x.c / maxP * 100}%;background:var(--c-cool)"></i></span><span class="v">${x.c}</span></div>`).join('')}</div></div>
    </div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px"><h2 class="h-sec" style="margin:0">Mapa da turma</h2><div class="actions"><button class="btn btn-quiet btn-sm" data-act="copiar-csv">Copiar CSV</button>${LIVE ? '<button class="btn btn-quiet btn-sm" data-act="baixar-csv">Baixar CSV</button>' : ''}</div></div>
      <textarea id="csv-fallback" hidden readonly style="width:100%;min-height:120px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px"></textarea>
      <div class="table-wrap"><table class="heat"><thead><tr><th>Pessoa</th><th class="num">Índice</th><th>Perfil</th>${DIMS.map(d => `<th class="num" title="${d.nome}">${d.nome}</th>`).join('')}<th>Data</th><th>Alertas</th></tr></thead><tbody>
      ${res.map(x => { const r = x.resultado; return `<tr><td><button class="link-btn" data-fac-open="${esc(x.id)}">${esc(x.nome || 'Sem nome')}</button>${x.exemplo ? ' <span class="tag">exemplo</span>' : ''}</td><td class="num"><b>${r.indice}</b></td><td>${PROFILES[r.perfil].nome}</td>${DIMS.map(d => `<td class="cell" style="${heat(r.dims[d.id])}">${r.dims[d.id]}</td>`).join('')}<td>${fmtDate(x.created_at)}</td><td>${r.alerts.map(a => esc(a.t)).join(', ') || '—'}</td></tr>`; }).join('')}
      </tbody></table></div>
      <p class="small muted" style="margin-top:10px">Cor mais intensa indica pontuação mais alta. Toque no nome para abrir o relatório da pessoa.</p>
    </div>`;
  return `<main class="page"><div class="wrap stack-lg">
    <div class="stack" style="gap:6px"><span class="eyebrow">Painel do facilitador</span><h1 style="font-size:clamp(28px,5vw,40px)">Turmas e resultados</h1></div>
    <div class="card stack">
      <form id="f-turma" class="inline-form" novalidate><div class="field"><label for="tm-nome">Nova turma</label><input id="tm-nome" type="text" placeholder="Ex.: Workshop Venda com Propósito · novembro" required></div><button class="btn btn-primary btn-sm" type="submit">Criar turma e gerar código</button></form>
      ${F.newCode ? `<div class="msg msg-ok" role="status">Turma criada. Código de acesso: <span class="code-box">${esc(F.newCode)}</span> <button type="button" class="link-btn" data-copy="${esc(F.newCode)}">Copiar</button></div>` : ''}
    </div>
    <div class="stack" style="gap:10px"><span class="small muted">Turma selecionada${selT ? ` · código <b class="tnum" style="color:var(--ink)">${esc(selT.codigo)}</b> <button type="button" class="link-btn small" data-copy="${esc(selT.codigo)}">copiar</button>` : ''}</span><div class="turma-chips">${chips}</div></div>
    ${F.results === null ? '<p class="muted">Carregando…</p>' : body}
  </div></main>`;
}

/* ================================ RENDER ================================== */
function installBar() {
  if (!S.installEvt || S.installHidden) return '';
  return `<div class="install no-print"><div class="wrap"><span class="small">Instale o Diagnóstico OQGCI como aplicativo no seu celular.</span><span class="actions" style="flex-wrap:nowrap"><button class="btn btn-primary btn-sm" data-act="instalar" style="width:auto">Instalar</button><button class="btn btn-quiet btn-sm" data-act="fechar-instalar" style="width:auto" aria-label="Fechar aviso">✕</button></span></div></div>`;
}

function render() {
  const views = { inicio: viewInicio, referencias: viewReferencias, entrar: viewEntrar, painel: viewPainel, diagnostico: viewDiagnostico, resultado: viewResultado, facilitador: viewFacilitador, 'nova-senha': viewNovaSenha };
  $('#app').innerHTML = topBar() + views[S.route]() + installBar();
}

/* ================================ EVENTOS ================================= */
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-go],[data-act],[data-tab],[data-ans],[data-sjt],[data-open],[data-fac-open],[data-turma],[data-copy]');
  if (!t) return;
  if (t.dataset.go) { if (t.dataset.go === 'diagnostico' && !S.quiz) startQuiz(); go(t.dataset.go); return; }
  if (t.dataset.tab) { S.authTab = t.dataset.tab; S.authMsg = null; render(); return; }
  if (t.dataset.copy) { copyText(t.dataset.copy); return; }
  if (t.dataset.ans) {
    const q = S.quiz; const it = ITEMS[q.step - 1]; q.items[it.c] = Number(t.dataset.ans); saveDraft(); render();
    setTimeout(() => { if (S.route === 'diagnostico' && S.quiz === q && q.step - 1 < TOTAL - 1) { q.step += 1; saveDraft(); render(); } }, 220);
    return;
  }
  if (t.dataset.sjt) {
    const q = S.quiz; const sc = SJT[q.step - 1 - ITEMS.length]; q.sjt[sc.id] = t.dataset.sjt; saveDraft(); render();
    setTimeout(() => { if (S.route === 'diagnostico' && S.quiz === q && q.step - 1 < TOTAL - 1) { q.step += 1; saveDraft(); render(); } }, 220);
    return;
  }
  if (t.dataset.open) { const r = await store.getResult(t.dataset.open); if (r) { S.result = r; go('resultado'); } return; }
  if (t.dataset.facOpen) { const r = (S.fac.results || []).find(x => x.id === t.dataset.facOpen); if (r) { S.result = r; go('resultado'); } return; }
  if (t.dataset.turma) { S.fac.sel = t.dataset.turma; S.fac.results = null; S.fac.newCode = null; render(); try { S.fac.results = await store.turmaResults(S.fac.sel); } catch (e) { S.fac.results = []; toast(e.message); } render(); return; }
  const act = t.dataset.act;
  if (act === 'criar') { S.authTab = 'criar'; S.authMsg = null; go('entrar'); }
  else if (act === 'esqueci') { S.authTab = 'esqueci'; S.authMsg = null; render(); }
  else if (act === 'sair') { await store.signOut(); S.session = null; S.result = null; S.quiz = null; S.fac = { turmas: null, sel: null, results: null, newCode: null }; go('inicio'); }
  else if (act === 'fac-demo') { S.session = await store.signInFacilitatorDemo(); go('facilitador'); }
  else if (act === 'qz-start') { quizStart(); }
  else if (act === 'qz-back') { const q = S.quiz; q.step = Math.max(0, q.step - 1); saveDraft(); render(); }
  else if (act === 'qz-next') { const q = S.quiz; q.step = Math.min(TOTAL, q.step + 1); saveDraft(); render(); }
  else if (act === 'qz-finish') { quizFinish(); }
  else if (act === 'copiar-resumo') { copyText(resumoTexto(S.result), $('#resumo-fallback')); }
  else if (act === 'imprimir') { window.print(); }
  else if (act === 'copiar-csv') { copyText(csvOf(S.fac.results || []), $('#csv-fallback')); }
  else if (act === 'baixar-csv') {
    const blob = new Blob(['﻿' + csvOf(S.fac.results || [])], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'diagnostico-oqgci.csv'; document.body.appendChild(a); a.click(); a.remove();
  }
  else if (act === 'instalar') { const e = S.installEvt; S.installEvt = null; render(); if (e) { e.prompt(); try { await e.userChoice; } catch (x) { /* */ } } }
  else if (act === 'fechar-instalar') { S.installHidden = true; render(); }
});

document.addEventListener('keydown', (ev) => {
  if (S.route !== 'diagnostico' || !S.quiz || S.quiz.step === 0) return;
  if (ev.target.closest('input,textarea')) return;
  const idx = S.quiz.step - 1;
  const n = idx < ITEMS.length ? 5 : 3;
  const k = idx < ITEMS.length ? Number(ev.key) : ' abc'.indexOf(ev.key.toLowerCase());
  if (k >= 1 && k <= n) { const btn = document.querySelectorAll('.opt')[k - 1]; if (btn) btn.click(); }
});

document.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const val = id => ($('#' + id)?.value || '');
  const fail = t => { S.busy = false; S.authMsg = { t }; render(); };
  if (f.id === 'f-entrar') {
    const email = val('in-email'), senha = val('in-senha');
    if (!email || !senha) return fail('Informe o e-mail e a senha.');
    S.busy = true; S.authMsg = null; render();
    try { S.session = await store.signIn({ email, senha }); S.busy = false; go('painel'); } catch (e) { fail(e.message); }
  } else if (f.id === 'f-criar') {
    const nome = val('cr-nome'), email = val('cr-email'), senha = val('cr-senha');
    if (!nome.trim() || !email.trim()) return fail('Informe o seu nome e o seu e-mail.');
    if (!/^\S+@\S+\.\S+$/.test(email.trim())) return fail('O e-mail parece incompleto. Confira e tente de novo.');
    if (senha.length < 6) return fail('A senha precisa ter pelo menos 6 caracteres.');
    if (!$('#cr-lgpd').checked) return fail('Para criar a conta, marque a autorização de uso das respostas.');
    S.busy = true; S.authMsg = null; render();
    try {
      const r = await store.signUp({ nome, email, senha });
      S.busy = false;
      if (r.needsConfirm) { S.authTab = 'entrar'; S.authMsg = { ok: true, t: 'Conta criada. Enviamos um link de confirmação para o seu e-mail. Depois de confirmar, entre com a sua senha.' }; render(); }
      else { S.session = r.user; go('painel'); }
    } catch (e) { fail(e.message); }
  } else if (f.id === 'f-esqueci') {
    const email = val('rs-email');
    if (!email.trim()) return fail('Informe o seu e-mail.');
    S.busy = true; render();
    try {
      const r = await store.resetPassword(email); S.busy = false;
      S.authMsg = { ok: true, t: r.demo ? 'Na prévia não há envio de e-mail. Na versão publicada, você recebe um link para criar uma nova senha.' : 'Se houver uma conta com esse e-mail, você vai receber um link para criar uma nova senha.' }; render();
    } catch (e) { fail(e.message); }
  } else if (f.id === 'f-nova') {
    const senha = val('nv-senha');
    if (senha.length < 6) return fail('A senha precisa ter pelo menos 6 caracteres.');
    try { await store.updatePassword(senha); S.session = await store.getSession(); S.authMsg = null; toast('Senha atualizada'); go('painel'); } catch (e) { fail(e.message); }
  } else if (f.id === 'f-turma') {
    const nome = val('tm-nome');
    if (!nome.trim()) { toast('Dê um nome para a turma'); return; }
    try { const t = await store.createTurma(nome); S.fac.newCode = t.codigo; S.fac.sel = t.id; S.fac.turmas = await store.listTurmas(); S.fac.results = await store.turmaResults(t.id); render(); }
    catch (e) { toast(e.message); }
  }
});

window.addEventListener('hashchange', route_);
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; render(); });

/* ================================ INÍCIO ================================== */
(async function boot() {
  $('#app').innerHTML = topBar() + '<main class="page"><div class="wrap"><p class="muted">Carregando…</p></div></main>';
  try {
    await store.init(() => { S.authMsg = null; S.route = 'nova-senha'; location.hash = 'nova-senha'; render(); });
    S.session = await store.getSession();
  } catch (e) {
    S.session = null;
    console.error(e);
  }
  if (location.hash.slice(1) === 'nova-senha' && LIVE) { S.route = 'nova-senha'; render(); return; }
  route_();
})();

window.__OQGCI = { scoreAnswers, ITEMS, SJT, DIMS };
})();
</script>
