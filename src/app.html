          <div class="legend">${['assertiva', 'passiva', 'agressiva'].map(k => `<span><i class="swatch" style="background:${POSTURA_COR[k]}"></i>${POSTURA_NOME[k]} <b class="tnum">${r.postura[k]}</b></span>`).join('')}</div>
        </div>
      </div>
    </div>

    ${r.confiab && r.confiab.nivel === 'Baixa' ? `<div class="msg" role="note">${esc(V(pk.notaBaixa, voc))}</div>` : ''}
    ${r.alerts.length ? `<div class="stack"><h2 class="h-sec" style="margin:0">Pontos de atenção</h2>${r.alerts.map(a => `<div class="alert ${a.sev}"><span class="alert-ico" aria-hidden="true">!</span><div><strong>${esc(a.t)}</strong><span class="muted small">${esc(V(a.d, voc))}</span></div></div>`).join('')}</div>` : ''}

    <div class="grid-2">
      <div class="card"><h2 class="h-sec">Mapa OQGCI</h2><div class="map-wrap">${oqgciMap(r)}</div>
        <div class="stack" style="gap:10px;margin-top:6px">${meter('Aproximação · o cliente percebe o ganho', r.aprox, 'var(--c-warm)')}${meter('Afastamento · o cliente se livra do que faz mal', r.afast, 'var(--c-cool)')}</div>
        <p class="small" style="margin-top:12px"><b>${QUADS[q].nome}.</b> <span class="muted">${esc(V(pk.quad(q), voc))}</span></p></div>
      <div class="card"><h2 class="h-sec">As oito dimensões</h2><div class="radar-wrap">${radar(r.dims)}</div>
        <div class="legend"><span><i class="swatch" style="background:var(--c-warm)"></i>Aproximação</span><span><i class="swatch" style="background:var(--cool)"></i>Afastamento</span><span><i class="swatch" style="background:var(--ink-2)"></i>Linha de base</span></div></div>
    </div>

    <div class="stack"><h2 class="h-sec" style="margin:0">Suas forças</h2>
      <div class="grid-3">${r.forcas.map(k => `<div class="card prio"><div class="prio-head"><strong>${DIM[k].nome}</strong><b class="tnum">${r.dims[k]}</b></div>${levelMeter(r.dims[k], eixoCor(DIM[k].eixo), DIM[k].nome)}<p class="muted small">${esc(V(pk.bands[k][bandOf(r.dims[k])], voc))}</p></div>`).join('')}</div></div>

    <div class="stack"><div class="acc-headrow"><div class="stack" style="gap:6px"><h2 class="h-sec" style="margin:0">Leitura das oito dimensões</h2><p class="muted small">Toque em uma dimensão para abrir a leitura completa.</p></div><button class="btn btn-quiet btn-sm no-print" data-act="acc-all" data-target="dim-acc">Abrir todas</button></div>
      <div class="acc-list">${dimCards}</div></div>

    <div class="stack"><div class="acc-headrow"><div class="stack" style="gap:6px"><h2 class="h-sec" style="margin:0">Sua postura nas situações</h2><p class="muted small">Toque em uma situação para ver a sua resposta, o efeito dela na decisão do cliente e por que a resposta assertiva funciona.</p></div><button class="btn btn-quiet btn-sm no-print" data-act="acc-all" data-target="sit-acc">Abrir todas</button></div>
      <div class="acc-list">${situacoes}</div></div>

    ${historia}
    ${isFac ? confiabHTML(r) + sinaisHTML(r) : ''}

    <div class="stack"><div class="stack" style="gap:6px"><h2 class="h-sec" style="margin:0">Prioridades de desenvolvimento</h2><p class="muted small">Abra cada prioridade e avance etapa por etapa: o que está em jogo, o que desenvolver, como implementar e como saber que está funcionando.</p></div><div class="acc-list">${prioridades}</div></div>


    <div class="stack"><h2 class="h-sec" style="margin:0">${pk.perguntasTitulo}</h2>
      <div class="questions">${pk.questions.map(([k, t]) => `<div class="question"><span class="eyebrow">${k}</span><strong style="font-family:var(--font-display);font-size:19px;font-weight:600">${esc(V(t, voc))}</strong></div>`).join('')}</div></div>

    <div class="card stack no-print" style="gap:12px"><h2 class="h-sec" style="margin:0">Leve o seu diagnóstico</h2><p class="muted small">O relatório em PDF traz todas as leituras, abertas, para guardar ou enviar.${LIVE ? ' No celular, Compartilhar envia o PDF por WhatsApp ou e-mail.' : ''}</p><div class="actions">${exportBtns}</div></div>

    <div class="actions no-print">${isMine ? '<button class="btn btn-primary" data-go="painel">Voltar ao meu painel</button>' : '<button class="btn btn-primary" data-go="facilitador">Voltar ao painel do facilitador</button>'}<button class="btn btn-ghost" data-go="referencias">Referências científicas</button></div>
  </div></main>`;
}

/* ---------- Relatório em PDF ---------- */
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
function loadJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf);
  return new Promise((ok, fail) => {
    const s = document.createElement('script'); s.src = JSPDF_URL; s.async = true;
    s.onload = () => window.jspdf ? ok(window.jspdf) : fail(new Error('jspdf'));
    s.onerror = () => fail(new Error('Não foi possível carregar o gerador de PDF. Verifique a conexão.'));
    document.head.appendChild(s);
  });
}
// As fontes padrão do PDF cobrem os acentos do português; aspas curvas e símbolos viram equivalentes simples.
const pdfText = t => String(t ?? '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/[–—]/g, '-').replace(/·/g, '-').replace(/…/g, '...').replace(/→/g, '->').replace(/[✓●]/g, '').replace(/­/g, '').replace(/[^\x00-\xFF]/g, '');

async function logoDataURL() {
  try {
    const res = await fetch(LOGO_ESCURO); if (!res.ok) return null;
    const blob = await res.blob();
    return await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = () => ok(null); fr.readAsDataURL(blob); });
  } catch (e) { return null; }
}

// Fontes do PDF (Manrope e Urbanist, as mesmas do caderno). Sem elas, o PDF usa Helvetica.
const PDF_FONTS = [['Manrope-Regular.ttf', 'Manrope', 'normal'], ['Manrope-SemiBold.ttf', 'Manrope', 'semibold'], ['Manrope-ExtraBold.ttf', 'Manrope', 'bold'],
  ['Urbanist-Light.ttf', 'Urbanist', 'light'], ['Urbanist-Bold.ttf', 'Urbanist', 'bold']];
let pdfFontCache = null;
async function pdfFontData() {
  if (pdfFontCache) return pdfFontCache;
  try {
    const out = [];
    for (const [file, fam, st] of PDF_FONTS) {
      const res = await fetch('fonts/' + file); if (!res.ok) return null;
      const buf = new Uint8Array(await res.arrayBuffer()); let bin = '';
      for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
      out.push([file, fam, st, btoa(bin)]);
    }
    return (pdfFontCache = out);
  } catch (e) { return null; }
}
// Com as fontes do caderno, acentos e pontuação tipográfica saem como no texto; o que elas não têm vira equivalente simples.
const pdfTextRico = t => String(t ?? '').replace(/→/g, '->').replace(/[✓●]/g, '').replace(/­/g, '').replace(/[^\x00-\xFF–—‘’“”…•]/g, '');

async function buildPDF(rec) {
  const { jsPDF } = await loadJsPDF();
  const [logo, fontes] = await Promise.all([logoDataURL(), pdfFontData()]);
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  if (fontes) { try { fontes.forEach(([file, fam, st, b64]) => { doc.addFileToVFS(file, b64); doc.addFont(file, fam, st); }); } catch (e) { /* segue com Helvetica */ } }
  const RICO = Boolean(fontes) && doc.getFontList().Manrope;
  const T = RICO ? pdfTextRico : pdfText;
  const r = rec.resultado; const lvl = levelOf(r.indice); const voc = vocabOf(rec.respostas?.negocio);
  const pk = pack(rec.respostas?.negocio); const p = pk.perfil(r.perfil);
  const W = 210, H = 297, M = 18, CW = W - 2 * M, BOTTOM = 274;
  // Paleta do caderno, econômica em tinta.
  const C = {
    ink: [42, 44, 51], ink2: [86, 90, 101], ink3: [138, 142, 152], line: [216, 211, 200], line2: [233, 229, 220], white: [255, 255, 255],
    warm: [181, 112, 26], warmL: [235, 200, 143], warmT: [252, 244, 232], cool: [60, 120, 194], coolL: [169, 198, 234], coolT: [239, 245, 252],
    base: [110, 114, 128], baseL: [207, 209, 216], baseT: [243, 243, 245], good: [59, 148, 104], goodT: [238, 247, 242],
    crit: [191, 79, 92], critT: [251, 239, 241], warn: [176, 128, 22], warnT: [252, 246, 230], mag: [169, 84, 138], magT: [251, 241, 247],
    ambar: [240, 179, 94], azul: [141, 184, 238]
  };
  const EIXO = { aprox: [C.warm, C.warmL, C.warmT, 'Aproximação'], afast: [C.cool, C.coolL, C.coolT, 'Afastamento'], base: [C.base, C.baseL, C.baseT, 'Linha de base'] };
  const POST = { assertiva: [C.warm, C.warmT], passiva: [C.cool, C.coolT], agressiva: [C.mag, C.magT] };
  let y = 0;
  const color = (c, kind = 'text') => kind === 'text' ? doc.setTextColor(...c) : kind === 'fill' ? doc.setFillColor(...c) : doc.setDrawColor(...c);
  // Papéis tipográficos: título (Urbanist Bold), número (Urbanist Light), texto, semi e forte (Manrope).
  const font = (size, role = 'body', c = C.ink) => {
    const map = RICO ? { title: ['Urbanist', 'bold'], light: ['Urbanist', 'light'], body: ['Manrope', 'normal'], semi: ['Manrope', 'semibold'], bold: ['Manrope', 'bold'] }
      : { title: ['helvetica', 'bold'], light: ['helvetica', 'normal'], body: ['helvetica', 'normal'], semi: ['helvetica', 'bold'], bold: ['helvetica', 'bold'] };
    doc.setFont(...map[role]); doc.setFontSize(size); color(c);
  };
  const lh = size => size * 0.43;
  const linhas = (t, size, role, width) => { font(size, role); return doc.splitTextToSize(T(t), width); };
  const altura = (t, size, role, width) => linhas(t, size, role, width).length * (lh(size) + 0.6);
  const escrever = (t, x, yy, size, role, c, width) => { const ls = linhas(t, size, role, width); font(size, role, c); ls.forEach((ln, i) => doc.text(ln, x, yy + lh(size) + i * (lh(size) + 0.6))); return ls.length * (lh(size) + 0.6); };
  const eyebrow = (t, x, yy, c = C.warm, size = 6.8, align) => { font(size, 'bold', c); doc.setCharSpace(0.35); doc.text(T(t).toUpperCase(), x, yy, align ? { align } : undefined); doc.setCharSpace(0); };
  const caixa = (x, yy, w, h, fill, stroke, lw = 0.3) => { if (fill) color(fill, 'fill'); if (stroke) { color(stroke, 'draw'); doc.setLineWidth(lw); } doc.roundedRect(x, yy, w, h, 2.6, 2.6, fill && stroke ? 'FD' : fill ? 'F' : 'S'); };
  const barra = (x, yy, w, h, v, c, marcas) => {
    color(C.line2, 'fill'); doc.roundedRect(x, yy, w, h, h / 2, h / 2, 'F');
    color(c, 'fill'); doc.roundedRect(x, yy, Math.max(h, w * v / 100), h, h / 2, h / 2, 'F');
    color(C.white, 'draw'); doc.setLineWidth(0.35); marcas.forEach(t => doc.line(x + w * t / 100, yy, x + w * t / 100, yy + h));
  };
  // Símbolo do método: metade âmbar (Aproximação), meia lua azul (Afastamento) e o anel da linha de base.
  const simbolo = (cx, cy, rr) => {
    color(C.line, 'draw'); doc.setLineWidth(rr * 0.08); doc.circle(cx, cy, rr * 12.5 / 11.5, 'S');
    color(C.ambar, 'fill'); doc.circle(cx, cy, rr, 'F'); color(C.white, 'fill'); doc.rect(cx, cy - rr - 0.2, rr + 0.3, 2 * rr + 0.4, 'F');
    const b = rr * 7.5 / 11.5; color(C.azul, 'fill'); doc.circle(cx, cy, b, 'F'); color(C.ambar, 'fill'); doc.rect(cx - b - 0.05, cy - b - 0.05, b + 0.05, 2 * b + 0.1, 'F');
  };
  const rodape = () => {
    font(6.4, 'body', C.ink3); doc.text(T(COPYRIGHT), M, 289);
    font(8, 'bold', C.warm); doc.text(String(doc.getNumberOfPages()), W - M, 289, { align: 'right' });
  };
  const cabecalho = () => {
    simbolo(M + 2.2, 11.2, 2.2);
    font(7.4, 'semi', C.ink3); doc.text(T('Diagnóstico OQGCI'), M + 6.6, 12.4);
    doc.text(T(`${rec.nome ? rec.nome + ' · ' : ''}${fmtDate(rec.created_at)}`), W - M, 12.4, { align: 'right' });
    color(C.line2, 'draw'); doc.setLineWidth(0.25); doc.line(M, 16, W - M, 16);
  };
  const novaPagina = () => { rodape(); doc.addPage(); cabecalho(); y = 24; };
  const precisa = h => { if (y + h > BOTTOM) novaPagina(); };
  const secao = (eb, titulo, lead) => {
    const hl = lead ? altura(lead, 9, 'body', CW) + 2 : 0;
    precisa(26 + hl + 45); y += 4;
    eyebrow(eb, M, y + 3); font(16, 'title', C.ink); doc.text(T(titulo), M, y + 11);
    color(C.warmL, 'fill'); doc.rect(M, y + 14, 14, 0.8, 'F'); y += 19;
    if (lead) { y += escrever(lead, M, y, 9, 'body', C.ink2, CW) + 3; }
  };

  /* ---------------- Capa ---------------- */
  color(C.warmL, 'draw'); doc.setLineWidth(0.35); [74, 62, 50].forEach(rr => doc.circle(W + 18, 64, rr, 'S'));
  color(C.coolL, 'draw'); [38, 26, 14].forEach(rr => doc.circle(W + 18, 64, rr, 'S'));
  if (logo) { try { doc.addImage(logo, 'PNG', M, 16, 19, 21); } catch (e) { /* segue sem o logo */ } }
  [[C.warmL, 0], [C.coolL, 1], [C.baseL, 2]].forEach(([c, i]) => { color(c, 'fill'); doc.roundedRect(M + i * 15, 64, 12, 1.4, 0.7, 0.7, 'F'); });
  eyebrow('Venda com Neurociência · Metodologia OQGCI', M, 74);
  font(34, 'title', C.ink); doc.text(T('Diagnóstico OQGCI'), M, 89);
  let yc = 98;
  if (rec.nome) { font(17, 'light', C.ink); doc.text(T(rec.nome), M, yc); yc += 8; }
  font(9.2, 'body', C.ink2); doc.text(T(`Diagnóstico completo · ${fmtDate(rec.created_at)}`), M, yc); yc += 5;
  doc.text(T(negocioLinha(rec) || 'Neurociência aplicada à venda'), M, yc); yc += 10;

  // Índice e perfil
  const colA = 78, colB = CW - colA - 6;
  const txtNivel = V(pk.leituraNivel(lvl.nome), voc);
  const txtPerfil = V(p.conversa + ' ' + p.foco, voc);
  const hA = 8 + 18 + 7 + 6 + altura(txtNivel, 8.4, 'body', colA - 12) + 6;
  const hB = 8 + 10 + altura(txtPerfil, 8.4, 'body', colB - 12) + 6;
  const hAB = Math.max(hA, hB);
  caixa(M, yc, colA, hAB, C.white, C.line);
  eyebrow('Índice OQGCI', M + 6, yc + 8);
  font(40, 'light', C.ink); doc.text(String(r.indice), M + 5, yc + 24);
  const wN = doc.getTextWidth(String(r.indice)); font(11, 'body', C.ink3); doc.text('/100', M + 6 + wN, yc + 24);
  font(9.5, 'semi', C.warm); doc.text(T(`Nível ${lvl.n} · ${lvl.nome}`), M + 6, yc + 31);
  barra(M + 6, yc + 34, colA - 12, 2.6, r.indice, C.warm, [40, 60, 80]);
  escrever(txtNivel, M + 6, yc + 39, 8.4, 'body', C.ink2, colA - 12);
  const xb = M + colA + 6;
  caixa(xb, yc, colB, hAB, C.white, C.line);
  eyebrow('Perfil', xb + 6, yc + 8);
  font(15, 'title', C.ink); doc.text(T(p.nome), xb + 6, yc + 16);
  escrever(txtPerfil, xb + 6, yc + 19, 8.4, 'body', C.ink2, colB - 12);
  yc += hAB + 6;

  // Mapa OQGCI em miniatura, com os dois eixos e a postura
  const q = quadOf(r); const hMapa = 62;
  caixa(M, yc, CW, hMapa, C.white, C.line);
  const S = 46, mx = M + 12, my = yc + 6;
  const X = v => mx + S * v / 100, Y = v => my + S * (100 - v) / 100;
  [[0, 60, 60, 100, C.coolT], [60, 100, 60, 100, C.goodT], [0, 60, 0, 60, C.baseT], [60, 100, 0, 60, C.warmT]].forEach(([a, b, c2, d, f]) => { color(f, 'fill'); doc.rect(X(a), Y(d), X(b) - X(a), Y(c2) - Y(d), 'F'); });
  color(C.line, 'draw'); doc.setLineWidth(0.25); doc.rect(mx, my, S, S, 'S');
  color(C.ink3, 'draw'); doc.setLineDashPattern([0.8, 0.8], 0); doc.line(X(60), my, X(60), my + S); doc.line(mx, Y(60), mx + S, Y(60)); doc.setLineDashPattern([], 0);
  color(C.white, 'fill'); doc.circle(X(r.aprox), Y(r.afast), 2.2, 'F'); color(C.ink, 'fill'); doc.circle(X(r.aprox), Y(r.afast), 1.5, 'F');
  font(6.2, 'semi', C.warm); doc.text(T('Aproximação'), mx + S, my + S + 4, { align: 'right' });
  font(6.2, 'semi', C.cool); doc.text(T('Afastamento'), mx - 2.2, my + S, { angle: 90 });
  const xm = mx + S + 12, wm = M + CW - 6 - xm;
  eyebrow('Mapa OQGCI', xm, yc + 9);
  font(13, 'title', C.ink); doc.text(T(QUADS[q].nome), xm, yc + 16);
  let ym = yc + 18; ym += escrever(V(pk.quad(q), voc), xm, ym, 8.4, 'body', C.ink2, wm) + 3;
  [['Aproximação', r.aprox, C.warm], ['Afastamento', r.afast, C.cool]].forEach(([t, v, c]) => {
    font(8.2, 'semi', C.ink); doc.text(T(t), xm, ym + 3); font(8.2, 'bold', C.ink); doc.text(String(v), xm + wm, ym + 3, { align: 'right' });
    barra(xm, ym + 4.6, wm, 2.2, v, c, [60]); ym += 10;
  });
  font(7.6, 'body', C.ink3); doc.text(T(`Postura nas seis situações: ${r.postura.assertiva} assertiva, ${r.postura.passiva} passiva, ${r.postura.agressiva} agressiva.`), xm, Math.min(ym + 2, yc + hMapa - 4));
  yc += hMapa + 6;
  // Forças: as três maiores notas fora das prioridades
  if (r.forcas && r.forcas.length) {
    eyebrow('Suas forças', M, yc + 3); yc += 6;
    const cwf = (CW - 2 * 5) / 3;
    r.forcas.slice(0, 3).forEach((k, j) => {
      const xf = M + j * (cwf + 5); const [c, cl] = EIXO[DIM[k].eixo];
      caixa(xf, yc, cwf, 17, C.white, C.line); color(cl, 'fill'); doc.roundedRect(xf, yc, 1.4, 17, 0.7, 0.7, 'F');
      font(10.5, 'title', C.ink); doc.text(T(DIM[k].nome), xf + 5, yc + 7.5);
      font(6.4, 'bold', c); doc.setCharSpace(0.3); doc.text(T(EIXO[DIM[k].eixo][3]).toUpperCase(), xf + 5, yc + 12.5); doc.setCharSpace(0);
      font(16, 'light', c); doc.text(String(r.dims[k]), xf + cwf - 5, yc + 11.5, { align: 'right' });
    });
  }
  rodape();

  /* ---------------- Páginas internas ---------------- */
  doc.addPage(); cabecalho(); y = 24;

  if (r.alerts.length) {
    secao('Antes de tudo', 'Pontos de atenção');
    r.alerts.forEach(a => {
      const [c, t] = a.sev === 'crit' ? [C.crit, C.critT] : [C.warn, C.warnT];
      const h = 13 + altura(a.d, 8.8, 'body', CW - 14) + 4; precisa(h + 3);
      caixa(M, y, CW, h, t, null); color(c, 'fill'); doc.roundedRect(M, y, 1.4, h, 0.7, 0.7, 'F');
      eyebrow(a.sev === 'crit' ? 'Crítico' : 'Atenção', M + 6, y + 6, c, 6.2);
      font(10, 'semi', C.ink); doc.text(T(a.t), M + 6, y + 11);
      escrever(a.d, M + 6, y + 12.5, 8.8, 'body', C.ink2, CW - 14); y += h + 3;
    });
  }

  secao('Visão geral', 'As oito dimensões', 'Cada dimensão vai de 0 a 100. As cores mostram o eixo: âmbar para Aproximação, azul para Afastamento e cinza para a linha de base.');
  precisa(DIMS.length * 9 + 10);
  DIMS.forEach(d => {
    const v = r.dims[d.id]; const [c] = EIXO[d.eixo];
    font(9.4, 'semi', C.ink); doc.text(T(d.nome), M, y + 4.2);
    font(6.6, 'bold', C.ink3); doc.text(T(EIXO[d.eixo][3].toUpperCase()), M, y + 7.6);
    barra(M + 42, y + 2.2, CW - 82, 3, v, c, [25, 50, 75]);
    font(10, 'bold', C.ink); doc.text(String(v), M + CW - 26, y + 4.6, { align: 'right' });
    font(8, 'body', C.ink3); doc.text(T(nivelDim(v).nome), M + CW, y + 4.6, { align: 'right' });
    color(C.line2, 'draw'); doc.setLineWidth(0.2); doc.line(M, y + 9.2, M + CW, y + 9.2); y += 10;
  });
  y += 2;

  secao('Uma a uma', 'Leitura das dimensões');
  const items = rec.respostas?.items;
  DIMS.forEach(d => {
    const v = r.dims[d.id]; const [c, cl] = EIXO[d.eixo]; const w = CW - 12;
    const leitura = V(pk.bands[d.id][bandOf(v)], voc);
    const ex = itemExtremes(d.id, items);

function pdfName(rec) { return `diagnostico-oqgci-${(rec.nome || 'relatorio').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'relatorio'}-${rec.created_at.slice(0, 10)}.pdf`; }

async function exportPDF(mode, evo) {
  const rec = evo ? S.evo?.ev : S.result; if (!rec || S.pdfBusy) return;
  S.pdfBusy = true; setPdfButtons();
  try {
    const blob = evo ? await buildEvoPDF(rec) : await buildPDF(rec);
    const name = evo ? evoPdfName(rec) : pdfName(rec);
    let dl = null;
    try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (mode === 'share' && navigator.canShare) {
      const file = new File([blob], name, { type: 'application/pdf' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: evo ? 'Relatório de evolução OQGCI' : 'Diagnóstico OQGCI', text: evo ? 'Minha evolução no Diagnóstico OQGCI' : 'Meu Diagnóstico OQGCI' }); return; }
    }
    if (dl) { await dl.save({ filename: name, data: blob }); toast('Relatório salvo'); }
    else if (!window.claude) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('PDF baixado');

  } catch (e) {
    if (e && (e.code === 'declined' || e.name === 'AbortError')) { /* a pessoa cancelou */ }
    else toast((e && e.message && e.message.length < 120) ? e.message : 'Não foi possível gerar o PDF agora.');
  } finally { S.pdfBusy = false; setPdfButtons(); }
}

/* ============================== EVOLUÇÃO ================================= */
// Método de evolução (validado em 16/10/2026):
// - Turma: prévia, workshop e 45 dias. Leitura principal prévia -> 45 dias; o workshop entra como apoio.
// - Individual: primeira execução -> execução anterior -> execução atual.
// - Corte de 10 pontos nas dimensões e de 5 pontos no Índice.
// - Consolidou: subiu o corte do início ao fim e manteve o nível do ponto intermediário.
//   Avançou: subiu o corte do início ao fim (sem ponto intermediário, ou abaixo do que mostrou nele).
//   Em construção: subiu o corte no ponto intermediário e voltou para perto do início.
//   Estável: variação menor que o corte. Recuou: caiu o corte ou mais do início ao fim.
const EVO_CORTE = { dim: 10, indice: 5 };
const CLASSE = {
  consolidou: ['Consolidou', 'var(--good)'], avancou: ['Avançou', 'var(--good)'], construcao: ['Em construção', 'var(--warn)'],
  estavel: ['Estável', 'var(--ink-3)'], recuou: ['Recuou', 'var(--crit)']
};
const CLASSE_ORDEM = ['consolidou', 'avancou', 'construcao', 'estavel', 'recuou'];
function classeEvo(a, m, b, corte) {
  const d = b - a;
  if (d >= corte) return m != null && b - m <= -corte ? 'avancou' : m != null ? 'consolidou' : 'avancou';
  if (d <= -corte) return 'recuou';
  if (m != null && m - a >= corte) return 'construcao';
  return 'estavel';
}
const classeDe = (d, corte = EVO_CORTE.dim) => d >= corte ? 'avancou' : d <= -corte ? 'recuou' : 'estavel';
const fmtDelta = d => d > 0 ? '+' + d : d < 0 ? '−' + Math.abs(d) : '0';
const CONF_ORD = { Baixa: 0, Moderada: 1, Alta: 2 };
const MODO_NOME = { conversa: 'conversando com o cliente', contato: 'cliente escolhendo sozinho' };
const NUM_EXT = ['Nenhuma', 'Uma', 'Duas', 'Três'];
const tipoEvo = ev => ev.tipo || (ev.turma_id ? 'completo' : 'individual');

// Nome de cada ponto da comparação, para títulos (nome) e frases (em).
function rotulosEvo(ev) {
  const t = tipoEvo(ev); const meio = Boolean(ev.intermediario);
  if (t === 'workshop') return [{ nome: 'Prévia', em: 'na prévia' }, { nome: 'Workshop', em: 'no workshop' }];
  if (t === 'individual') return meio
    ? [{ nome: 'Primeira', em: 'na primeira execução' }, { nome: 'Anterior', em: 'na execução anterior' }, { nome: 'Atual', em: 'na execução atual' }]
    : [{ nome: 'Primeira', em: 'na primeira execução' }, { nome: 'Atual', em: 'na execução atual' }];
  return meio
    ? [{ nome: 'Prévia', em: 'na prévia' }, { nome: 'Workshop', em: 'no workshop' }, { nome: '45 dias', em: 'aos 45 dias' }]
    : [{ nome: 'Diagnóstico inicial', em: 'no diagnóstico inicial' }, { nome: 'Reavaliação', em: 'na reavaliação' }];
}

// Parcela das afirmações respondidas no extremo favorável da escala (5, ou 1 nas invertidas).
function fracaoMaximo(rec) {
  const it = rec?.respostas?.items || {}; let n = 0, max = 0;
  ITEMS.forEach(i => { const r = it[i.c]; if (r == null) return; n += 1; if ((i.inv && r === 1) || (!i.inv && r === 5)) max += 1; });
  return n ? max / n : 0;
}

function compararEvolucao(ev) {
  const ini = ev.inicial, mei = ev.intermediario || null, rea = ev.reavaliacao;
  const a = ini.resultado, m = mei ? mei.resultado : null, b = rea.resultado;
  const rot = rotulosEvo(ev); const fim = rot[rot.length - 1];
  const linha = (fa, fm, fb, corte) => ({ antes: fa, meio: fm, depois: fb, delta: fb - fa, classe: classeEvo(fa, fm, fb, corte) });
  const L = (f, corte = EVO_CORTE.dim) => linha(f(a), m ? f(m) : null, f(b), corte);
  const dims = Object.fromEntries(DIMS.map(d => [d.id, L(r => r.dims[d.id])]));
  const indice = L(r => r.indice, EVO_CORTE.indice);
  const grupos = Object.fromEntries(CLASSE_ORDEM.map(k => [k, DIMS.filter(d => dims[d.id].classe === k).map(d => d.id)]));
  const sa = ini.respostas?.sjt || {}, sm = mei?.respostas?.sjt || null, sb = rea.respostas?.sjt || {};
  const chave = x => x.k + '|' + x.d;
  const temA = new Set(a.alerts.map(chave)), temB = new Set(b.alerts.map(chave));
  const recs = [ini, mei, rea].filter(Boolean);
  const sinais = [];
  const modos = recs.filter(r => r.respostas?.negocio).map(r => modoDe(r.respostas.negocio));
  if (new Set(modos).size > 1) sinais.push(`O modo de compra mudou entre as execuções (${[...new Set(modos)].map(x => MODO_NOME[x]).join(' e ')}). Leia a comparação com cautela.`);
  const ca = a.confiab, cb = b.confiab;
  if (cb && cb.nivel === 'Baixa') sinais.push(`Confiabilidade baixa ${fim.em} (${cb.score})${cb.flags.length ? ': ' + cb.flags.join('; ') : ''}.`);
  else if (ca && cb && CONF_ORD[cb.nivel] < CONF_ORD[ca.nivel]) sinais.push(`A confiabilidade caiu de ${ca.nivel} (${ca.score}) para ${cb.nivel} (${cb.score})${cb.flags.length ? ': ' + cb.flags.join('; ') : ''}.`);
  if (m && m.indice - a.indice >= 15) {
    const fr = fracaoMaximo(mei);
    if (fr >= 0.6) sinais.push(`Salto de ${m.indice - a.indice} pontos ${rot[1].em}, com ${Math.round(fr * 100)}% das afirmações no máximo da escala. Dê mais peso à leitura ${fim.em}.`);
  }
  const prioIni = a.prioridades;
  const nEvo = prioIni.filter(k => ['consolidou', 'avancou'].includes(dims[k].classe)).length;
  const nivelA = levelOf(a.indice), nivelB = levelOf(b.indice);
  const ext = n => n === 3 ? 'três' : String(n);
  const partes = [];
  partes.push(`Índice de ${a.indice} ${rot[0].em} para ${b.indice} ${fim.em} (${fmtDelta(b.indice - a.indice)})${m ? `, com ${m.indice} ${rot[1].em}` : ''}.`);
  partes.push(nivelA.nome !== nivelB.nome ? `O nível passou de ${nivelA.nome} para ${nivelB.nome}.` : `O nível se manteve em ${nivelB.nome}.`);
  if (a.perfil !== b.perfil) partes.push(`O perfil passou de ${PROFILES[a.perfil].nome} para ${PROFILES[b.perfil].nome}.`);
  const cont = [['consolidou', 'consolidada', 'consolidadas'], ['avancou', 'em avanço', 'em avanço'], ['construcao', 'em construção', 'em construção'], ['recuou', 'em recuo', 'em recuo']]
    .filter(([k]) => grupos[k].length).map(([k, s1, s2]) => `${grupos[k].length} ${grupos[k].length === 1 ? 'dimensão' : 'dimensões'} ${grupos[k].length === 1 ? s1 : s2}`);
  if (cont.length) partes.push(cont.join(', ').replace(/, ([^,]*)$/, ' e $1') + '.');
  partes.push(nEvo === prioIni.length ? `As ${ext(prioIni.length)} prioridades apontadas ${rot[0].em} avançaram.` : nEvo === 0 ? `Nenhuma das prioridades apontadas ${rot[0].em} subiu ${EVO_CORTE.dim} pontos ou mais.` : `${NUM_EXT[nEvo]} das ${ext(prioIni.length)} prioridades apontadas ${rot[0].em} ${nEvo === 1 ? 'avançou' : 'avançaram'}.`);
  return {
    tipo: tipoEvo(ev), rot, indice, aprox: L(r => r.aprox), afast: L(r => r.afast), dims, grupos,
    nivelA, nivelM: m ? levelOf(m.indice) : null, nivelB, perfis: [a.perfil, m ? m.perfil : null, b.perfil], perfilA: a.perfil, perfilB: b.perfil,
    quadA: quadOf(a), quadB: quadOf(b), posturas: [a.postura, m ? m.postura : null, b.postura], posturaA: a.postura, posturaB: b.postura,
    prioIni, prioNovas: b.prioridades, nEvo, resumo: partes.join(' '),
    situacoes: SJT.map(s => ({ id: s.id, antes: sa[s.id] || null, meio: sm ? sm[s.id] || null : null, depois: sb[s.id] || null })),
    resolvidos: a.alerts.filter(x => !temB.has(chave(x))), novos: b.alerts.filter(x => !temA.has(chave(x))), mantidos: b.alerts.filter(x => temA.has(chave(x))),
    dias: Math.max(0, Math.round((new Date(rea.created_at) - new Date(ini.created_at)) / 86400000)),
    sinais, temMeio: Boolean(m)
  };
}

const classeChip = (k, d) => { const c = CLASSE[k]; return `<span class="delta" style="color:${c[1]};border-color:color-mix(in srgb, ${c[1]} 50%, transparent)">${d != null ? fmtDelta(d) + ' · ' : ''}${c[0]}</span>`; };
const deltaChip = (d, comClasse, corte = EVO_CORTE.dim) => { const c = CLASSE[classeDe(d, corte)]; return `<span class="delta" style="color:${c[1]};border-color:color-mix(in srgb, ${c[1]} 50%, transparent)">${fmtDelta(d)}${comClasse ? ' · ' + c[0] : ''}</span>`; };
const posturaChip = k => k ? `<span class="chip"><i class="swatch" style="background:${POSTURA_COR[k]}"></i>${POSTURA_NOME[k]}</span>` : '<span class="muted">—</span>';
const statusEvoChip = (s, tipo) => tipo === 'workshop' ? '<span class="chip"><i class="swatch" style="background:var(--c-cool)"></i>Interno</span>' : s === 'liberado' ? '<span class="chip"><i class="swatch" style="background:var(--good)"></i>Liberado</span>' : '<span class="chip"><i class="swatch" style="background:var(--warn)"></i>Rascunho</span>';
// Barras de cada ponto: o primeiro em cinza, o intermediário em tom claro e o último na cor do eixo.
const evoBars = (vals, cor, rot) => `<div class="evo-bars" role="img" aria-label="${vals.map((v, i) => (rot ? rot[i].nome + ' ' : '') + v).join(', ')}">${vals.map((v, i) => `<span class="evo-track"><i class="${i === 0 ? 'ant' : i < vals.length - 1 ? 'meio' : ''}" style="width:${Math.max(1, v)}%;${i ? `background:${cor}` : ''}"></i></span>`).join('')}</div>`;
const eixoCorEvo = e => e === 'aprox' ? 'var(--c-warm)' : e === 'afast' ? 'var(--c-cool)' : 'var(--ink-2)';
const valsDe = x => x.meio != null ? [x.antes, x.meio, x.depois] : [x.antes, x.depois];
const seq = vals => vals.map((v, i) => i === vals.length - 1 ? `<b>${v}</b>` : v).join(' → ');

// Linha do Índice em todas as execuções (relatório individual).
function serieSvg(serie) {
  if (!serie || serie.length < 3) return '';
  const Wd = 900, Hd = 190, L = 40, R = 30, T = 22, B = 30;
  const n = serie.length; const X = i => L + 26 + (Wd - L - R - 26) * (n === 1 ? 0.5 : i / (n - 1)); const Y = v => T + (Hd - T - B) * (100 - v) / 100;
  const grade = [0, 40, 60, 80, 100].map(v => `<line x1="${L}" x2="${Wd - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${v}</text>`).join('');
  const pts = serie.map((r, i) => `${X(i)},${Y(r.resultado.indice)}`).join(' ');
  const marcas = serie.map((r, i) => `<circle cx="${X(i)}" cy="${Y(r.resultado.indice)}" r="${i === n - 1 ? 5 : 3.5}" fill="${i === n - 1 ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/><text x="${X(i)}" y="${Y(r.resultado.indice) - 9}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${r.resultado.indice}</text><text x="${X(i)}" y="${Hd - 10}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${fmtDia(diaBR(r.created_at)).slice(0, 5)}</text>`).join('');
  return `<svg viewBox="0 0 ${Wd} ${Hd}" width="100%" role="img" aria-label="Índice OQGCI em cada execução: ${serie.map(r => r.resultado.indice).join(', ')}">${grade}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${marcas}</svg>`;
}

      ${cmp.novos.map(a => `<div class="alert ${a.sev}"><span class="alert-ico" aria-hidden="true">!</span><div><strong>${esc(a.t)} · novo</strong><span class="muted small">${esc(V(a.d, voc))}</span></div></div>`).join('')}</div>` : '';

        <div class="actions"><button class="btn btn-quiet btn-sm" data-act="evo-salvar">Salvar comentário</button>${ev.status === 'liberado' ? '<button class="btn btn-quiet btn-sm" data-act="evo-recolher">Recolher para rascunho</button>' : '<button class="btn btn-primary btn-sm" data-act="evo-liberar">Salvar e liberar para a pessoa</button>'}</div>
        <p class="small muted">O comentário aparece no relatório e no PDF da pessoa. Liberar envia o relatório ao painel dela; recolher tira do painel até você liberar de novo.</p></div>`
    : !interno && ev.comentario ? `<div class="card stack" style="gap:10px"><h2 class="h-sec" style="margin:0">Comentário do facilitador</h2><blockquote class="story">${esc(ev.comentario)}</blockquote></div>` : '';
  const serie = cmp.tipo === 'individual' ? serieSvg(S.evo.serie) : '';
  const perfis = cmp.perfis.filter((p, i) => p && (i !== 1 || cmp.temMeio)).filter((p, i, a) => i === 0 || p !== a[i - 1]);
  const titulo = interno ? 'Prévia e workshop' : isMine ? 'Sua evolução no Diagnóstico OQGCI' : 'Evolução no Diagnóstico OQGCI';

  return `<main class="page"><div class="wrap stack-lg">
    <div class="hello report-head"><div class="stack" style="gap:6px;min-width:0"><span class="eyebrow">${interno ? 'Relatório interno' : 'Relatório de evolução'}${!isMine && ev.nome ? ' · ' + esc(ev.nome) : ''}</span><h1 style="font-size:clamp(28px,5vw,40px)">${titulo}</h1>${negocioLinha(rea) ? `<p class="muted small">${esc(negocioLinha(rea))}</p>` : ''}</div><img src="${LOGO_CLARO}" alt="Logo de ${AUTOR}" class="report-logo" width="64" height="71" onerror="this.hidden=true"></div>
    ${banner}${sinais}
    <p class="evo-resumo">${esc(cmp.resumo)} <span class="muted">De ${fmtDate(ini.created_at)} a ${fmtDate(rea.created_at)}, ${cmp.dias} dias.</span></p>

        <div class="level-steps" aria-hidden="true">${LEVELS.slice().reverse().map(l => `<span class="${l.nome === cmp.nivelB.nome ? 'on' : ''}">${l.n} · ${l.nome}</span>`).join('')}</div>
        <p class="small muted">Nível ${cmp.nivelA.nome !== cmp.nivelB.nome ? `${cmp.nivelA.nome} → ${cmp.nivelB.nome}` : cmp.nivelB.nome}. No Índice, a variação conta a partir de ${EVO_CORTE.indice} pontos.</p>
      </div>
      <div class="card profile-card stack">

        <h2>${perfis.map((p, i) => i < perfis.length - 1 ? `<span class="muted" style="font-weight:400">${PROFILES[p].nome} →</span> ` : PROFILES[p].nome).join('')}</h2>
        <p>${esc(V(pB.conversa, voc))}</p>

        <div><p class="small muted" style="margin-bottom:8px">Respostas assertivas nas seis situações</p>
          <div class="legend">${rot.map((r, i) => `<span>${r.nome} <b class="tnum">${cmp.posturas[cmp.temMeio ? i : (i === 0 ? 0 : 2)].assertiva} de ${total}</b></span>`).join('')}</div></div>
      </div>
    </div>
    ${serie ? `<div class="card stack" style="gap:8px"><h2 class="h-sec" style="margin:0">Índice em todas as execuções</h2>${serie}</div>` : ''}

    ${leitura ? `<div class="card stack" style="gap:18px"><h2 class="h-sec" style="margin:0">Leitura da evolução</h2>${leitura}${estaveis}${legenda}</div>` : `<div class="card stack"><h2 class="h-sec" style="margin:0">Leitura da evolução</h2>${estaveis}</div>`}

    <div class="grid-2">

        <div class="evo-rows" style="margin-top:12px">

          ${linhaDim('Afastamento', cmp.afast, 'var(--c-cool)')}
        </div>
        <p class="small" style="margin-top:12px">${cmp.quadA !== cmp.quadB ? `De <b>${QUADS[cmp.quadA].nome}</b> para <b>${QUADS[cmp.quadB].nome}</b>.` : `<b>${QUADS[cmp.quadB].nome}.</b>`} <span class="muted">${esc(V(pk.quad(cmp.quadB), voc))}</span></p></div>
      <div class="card stack" style="align-content:start"><h2 class="h-sec" style="margin:0">As prioridades ${rot[0].em === 'na prévia' ? 'da prévia' : 'do ponto de partida'}</h2>

    ${alertas}
    ${comentario}

    <div class="stack"><div class="stack" style="gap:6px"><h2 class="h-sec" style="margin:0">Próximos 30 dias</h2><p class="muted small">As novas prioridades, a partir da execução mais recente. O passo a passo completo de cada uma está no relatório dela.</p></div>
      <div class="grid-3">${novas}</div>
      <div class="actions"><button class="btn btn-ghost btn-sm" data-open="${esc(rea.id)}">Abrir o relatório mais recente</button><button class="btn btn-quiet btn-sm" data-open="${esc(ini.id)}">Abrir o primeiro relatório</button></div></div>

    <div class="card stack no-print" style="gap:12px"><h2 class="h-sec" style="margin:0">Leve o relatório de evolução</h2><div class="actions"><button class="btn btn-primary btn-sm" data-act="evo-pdf" ${S.pdfBusy ? 'disabled' : ''}>${S.pdfBusy ? 'Gerando PDF…' : 'Baixar relatório em PDF'}</button>${LIVE && navigator.canShare && !interno ? '<button class="btn btn-quiet btn-sm" data-act="evo-compartilhar">Compartilhar</button>' : ''}</div></div>

    <div class="actions no-print">${isFac ? `<button class="btn btn-primary" data-go="facilitador">${ev.turma_id ? 'Voltar à evolução da turma' : 'Voltar aos relatórios individuais'}</button>` : '<button class="btn btn-primary" data-go="painel">Voltar ao meu painel</button>'}</div>
  </div></main>`;
}

function evoPdfName(ev) { return `evolucao-oqgci-${(ev.nome || 'relatorio').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'relatorio'}-${ev.reavaliacao.created_at.slice(0, 10)}.pdf`; }

// PDF do relatório de evolução, na identidade do relatório individual.
async function buildEvoPDF(ev) {
  const { jsPDF } = await loadJsPDF();
  const [logo, fontes] = await Promise.all([logoDataURL(), pdfFontData()]);
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  if (fontes) { try { fontes.forEach(([file, fam, st, b64]) => { doc.addFileToVFS(file, b64); doc.addFont(file, fam, st); }); } catch (e) { /* segue com Helvetica */ } }
  const RICO = Boolean(fontes) && doc.getFontList().Manrope;
  const T = RICO ? pdfTextRico : pdfText;
  const ini = ev.inicial, mei = ev.intermediario || null, rea = ev.reavaliacao; const cmp = compararEvolucao(ev);
  const rot = cmp.rot; const fim = rot[rot.length - 1]; const interno = cmp.tipo === 'workshop';
  const recs = [ini, mei, rea].filter(Boolean);
  const voc = vocabOf(rea.respostas?.negocio); const pk = pack(rea.respostas?.negocio);
  const W = 210, M = 18, CW = W - 2 * M, BOTTOM = 274;
  const C = {
    ink: [42, 44, 51], ink2: [86, 90, 101], ink3: [138, 142, 152], line: [216, 211, 200], line2: [233, 229, 220], white: [255, 255, 255],
    warm: [181, 112, 26], warmL: [235, 200, 143], warmT: [252, 244, 232], cool: [60, 120, 194], coolL: [169, 198, 234], coolT: [239, 245, 252],
    base: [110, 114, 128], baseL: [207, 209, 216], baseT: [243, 243, 245], good: [59, 148, 104], goodT: [238, 247, 242],
    crit: [191, 79, 92], critT: [251, 239, 241], warn: [176, 128, 22], warnT: [252, 246, 230], mag: [169, 84, 138], magT: [251, 241, 247],
    ambar: [240, 179, 94], azul: [141, 184, 238]
  };
  const EIXO = { aprox: [C.warm, C.warmL, C.warmT, 'Aproximação'], afast: [C.cool, C.coolL, C.coolT, 'Afastamento'], base: [C.base, C.baseL, C.baseT, 'Linha de base'] };
  const POST = { assertiva: [C.warm, C.warmT], passiva: [C.cool, C.coolT], agressiva: [C.mag, C.magT] };
  const CL = { consolidou: [C.good, C.goodT], avancou: [C.good, C.goodT], construcao: [C.warn, C.warnT], estavel: [C.ink3, C.baseT], recuou: [C.crit, C.critT] };
  let y = 0;
  const color = (c, kind = 'text') => kind === 'text' ? doc.setTextColor(...c) : kind === 'fill' ? doc.setFillColor(...c) : doc.setDrawColor(...c);
  const font = (size, role = 'body', c = C.ink) => {
    const map = RICO ? { title: ['Urbanist', 'bold'], light: ['Urbanist', 'light'], body: ['Manrope', 'normal'], semi: ['Manrope', 'semibold'], bold: ['Manrope', 'bold'] }
      : { title: ['helvetica', 'bold'], light: ['helvetica', 'normal'], body: ['helvetica', 'normal'], semi: ['helvetica', 'bold'], bold: ['helvetica', 'bold'] };
    doc.setFont(...map[role]); doc.setFontSize(size); color(c);
  };
  const lh = size => size * 0.43;
  const linhas = (t, size, role, width) => { font(size, role); return doc.splitTextToSize(T(t), width); };
  const altura = (t, size, role, width) => linhas(t, size, role, width).length * (lh(size) + 0.6);
  const escrever = (t, x, yy, size, role, c, width) => { const ls = linhas(t, size, role, width); font(size, role, c); ls.forEach((ln, i) => doc.text(ln, x, yy + lh(size) + i * (lh(size) + 0.6))); return ls.length * (lh(size) + 0.6); };
  const eyebrow = (t, x, yy, c = C.warm, size = 6.8, align) => { font(size, 'bold', c); doc.setCharSpace(0.35); doc.text(T(t).toUpperCase(), x, yy, align ? { align } : undefined); doc.setCharSpace(0); };

  cmp.prioIni.forEach(k => linhaDimPDF(DIM[k].nome, cmp.dims[k], DIM[k].eixo));

  SJT.forEach((s, k) => {

// Aba Evolução do painel do facilitador.
async function loadEvos() {
  const sel = S.fac.sel;
  if (sel === 'individuais') { try { S.fac.evos = await store.listEvolucoesIndividuais(); S.fac.evosErro = null; } catch (e) { S.fac.evos = []; S.fac.evosErro = e.message; } return; }
  if (!sel || sel === 'todos' || sel === 'sem') { S.fac.evos = []; S.fac.evosErro = null; return; }
  try { S.fac.evos = await store.listEvolucoes(sel); S.fac.evosErro = null; } catch (e) { S.fac.evos = []; S.fac.evosErro = e.message; }
}
function conviteTexto(t) {
  const url = location.origin + location.pathname;
  return `Olá! Chegou a hora de refazer o seu Diagnóstico OQGCI. Ele leva cerca de 15 minutos e mostra quanto você avançou desde o treinamento.\n\n`
    + `Acesse ${url}, entre com o mesmo e-mail e senha e toque em Iniciar diagnóstico${t.reavaliar_em ? `, a partir de ${fmtDia(t.reavaliar_em)}` : ''}${t.expira_em ? ` e até ${fmtDia(t.expira_em)}` : ''}.\n\n`
    + `Depois da minha revisão, o seu relatório de evolução aparece no seu painel, com a comparação entre as suas execuções e as prioridades para os próximos 30 dias.\n\n${AUTOR}`;
}
// Tabela de relatórios (turma ou individuais).
function tabelaEvos(cmps, opts = {}) {
  const ordem = cmps.slice().sort((x, y) => (x.e.status === 'liberado') - (y.e.status === 'liberado') || (y.e.reavaliacao.created_at || '').localeCompare(x.e.reavaliacao.created_at || ''));
  return `<div class="table-wrap"><table class="heat"><thead><tr><th>Pessoa</th><th>Índice</th><th>Variação</th><th>Dimensões</th><th>Sinais</th><th>Situação</th><th></th></tr></thead><tbody>
    ${ordem.map(({ e, c }) => `<tr><td><strong>${esc(e.nome || 'Sem nome')}</strong>${e.exemplo ? ' <span class="tag">exemplo</span>' : ''}<br><span class="muted small">${c.rot.map(r => r.nome).join(' → ')} · ${fmtDate(e.reavaliacao.created_at)}</span></td><td class="tnum">${seq(valsDe(c.indice))}</td><td>${classeChip(c.indice.classe, c.indice.delta)}</td><td class="small">${['consolidou', 'avancou', 'construcao', 'recuou'].filter(k => c.grupos[k].length).map(k => `${c.grupos[k].length} ${CLASSE[k][0].toLowerCase()}`).join(' · ') || '<span class="muted">estáveis</span>'}</td><td class="small">${c.sinais.length ? `<span style="color:var(--warn)">${c.sinais.length} ${c.sinais.length === 1 ? 'sinal' : 'sinais'}</span>` : '<span class="muted">—</span>'}</td><td>${statusEvoChip(e.status, c.tipo)}${e.comentario ? '<br><span class="muted small">com comentário</span>' : ''}</td><td><button type="button" class="btn btn-quiet btn-sm" data-evo-open="${esc(e.id)}">${c.tipo === 'workshop' || e.status === 'liberado' ? 'Abrir' : 'Revisar'}</button></td></tr>`).join('')}
    </tbody></table></div>`;
}
function viewEvolucoesIndividuais() {
  const F = S.fac;
  const intro = `<div class="card stack" style="gap:8px"><h2 class="h-sec" style="margin:0">Relatórios individuais</h2><p class="small muted">Cada nova execução de quem já tem diagnóstico anterior, fora das etapas da turma, gera um relatório: primeira execução → execução anterior → execução atual. Ele chega como rascunho para você revisar, comentar e liberar.</p></div>`;
  if (F.evos === null) return intro + '<p class="muted">Carregando…</p>';
  if (F.evosErro) return intro + `<div class="msg msg-err" role="alert">${esc(F.evosErro)}</div>`;
  if (!F.evos.length) return intro + '<div class="empty"><strong>Nenhum relatório individual ainda</strong><span class="small">Ele aparece aqui assim que alguém faz uma nova execução liberada por você.</span></div>';
  const cmps = F.evos.map(e => ({ e, c: compararEvolucao(e) }));
  const rasc = F.evos.filter(e => e.status !== 'liberado').length;
  return intro + `<div class="card stack"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 class="h-sec" style="margin:0">${F.evos.length} ${F.evos.length === 1 ? 'relatório' : 'relatórios'}</h2>${rasc ? `<span class="small muted">${rasc} aguardando a sua revisão</span>` : ''}</div>${tabelaEvos(cmps)}</div>`;

function viewEvolucaoTurma() {

    ${curta ? `<div class="msg" role="note">A validade da turma termina em ${fmtDia(t.expira_em)}, antes do fim da janela de reavaliação. <button type="button" class="link-btn" data-act="turma-estender" data-ate="${janelaFim}">Estender até ${fmtDia(janelaFim)}</button></div>` : ''}
    ${t.reavaliar_em ? `<div class="actions"><button type="button" class="btn btn-quiet btn-sm" data-copy="${esc(conviteTexto(t))}">Copiar convite para a turma</button></div>` : ''}
  </div>`;

  const res = F.results || []; const todas = F.evos;
  const evos = todas.filter(e => tipoEvo(e) === 'completo'); const internos = todas.filter(e => tipoEvo(e) === 'workshop');
  const nomes = {}; res.forEach(r => { nomes[r.user_id] = r.nome; });
  const comInicial = [...new Set(res.filter(r => ['previa', 'inicial'].includes(etapaTurma(t, diaBR(r.created_at)))).map(r => r.user_id))];
  const pareados = new Set(evos.map(e => e.user_id));
  const faltam = t.reavaliar_em && t.reavaliar_em <= hojeBR() ? comInicial.filter(u => !pareados.has(u)) : [];
  const liberados = evos.filter(e => e.status === 'liberado').length;
  const rascunhos = evos.filter(e => e.status !== 'liberado');
  const cmps = evos.map(e => ({ e, c: compararEvolucao(e) }));
  const andamento = `<div class="kpis">
      <div class="kpi"><b>${comInicial.length}</b><span>${t.data_workshop ? 'Fizeram a prévia' : 'Com diagnóstico inicial'}</span></div>
      ${t.data_workshop ? `<div class="kpi"><b>${internos.length}</b><span>Relatórios internos do workshop</span></div>` : ''}
      <div class="kpi"><b>${evos.length}</b><span>Fizeram a reavaliação</span></div>
      <div class="kpi"><b>${rascunhos.length}</b><span>Aguardando a sua revisão</span></div>
      <div class="kpi"><b>${liberados}</b><span>Relatórios liberados</span></div>
    </div>
    ${faltam.length ? `<p class="small muted">Ainda não fizeram a reavaliação: ${faltam.map(u => esc(nomes[u] || 'Sem nome')).join(', ')}.</p>` : ''}`;
  const blocoInternos = internos.length ? `<div class="card stack"><div><h2 class="h-sec" style="margin:0">Relatórios internos · prévia → workshop</h2><span class="tag" style="display:inline-block;margin-top:8px">Visível só para o facilitador</span></div>${tabelaEvos(internos.map(e => ({ e, c: compararEvolucao(e) })))}</div>` : '';
  if (!evos.length) return config + andamento + blocoInternos + `<div class="empty"><strong>Nenhuma reavaliação ainda</strong><span class="small">Cada relatório completo aparece aqui assim que a pessoa faz a execução dos 45 dias.</span></div>`;

  const m = (sel) => Math.round(avg(cmps.map(x => sel(x.c))));
  const comMeio = cmps.filter(x => x.c.temMeio);
  const mm = sel => comMeio.length ? Math.round(avg(comMeio.map(x => sel(x.c)))) : null;
  const conta = k => cmps.filter(x => x.c.indice.classe === k).length;
  const rotT = cmps[0].c.rot;
  const turmaDims = DIMS.map(d => ({ d, a: m(c => c.dims[d.id].antes), w: mm(c => c.dims[d.id].meio), b: m(c => c.dims[d.id].depois) }));
  const vals3 = (a, w, b) => w != null ? [a, w, b] : [a, b];
  const turmaCard = `<div class="grid-2">
      <div class="card stack"><h2 class="h-sec" style="margin:0">A turma ao longo das etapas</h2>
        <div class="evo-num"><span class="a tnum">${m(c => c.indice.antes)}</span>${mm(c => c.indice.meio) != null ? `<span class="evo-seta" aria-hidden="true">→</span><span class="a tnum">${mm(c => c.indice.meio)}</span>` : ''}<span class="evo-seta" aria-hidden="true">→</span><span class="b tnum">${m(c => c.indice.depois)}</span>${deltaChip(m(c => c.indice.depois) - m(c => c.indice.antes), true, EVO_CORTE.indice)}</div>
        <p class="small muted">Índice médio de quem já fez a reavaliação (${evos.length} ${evos.length === 1 ? 'pessoa' : 'pessoas'}): ${rotT.map(r => r.nome).join(' → ')}.</p>
        <div class="legend">${CLASSE_ORDEM.map(k => `<span><i class="swatch" style="background:${CLASSE[k][1]}"></i>${CLASSE[k][0]} <b class="tnum">${conta(k)}</b></span>`).join('')}</div>
        <p class="small muted">Classificação pelo Índice OQGCI de cada pessoa, com corte de ${EVO_CORTE.indice} pontos.</p></div>
      <div class="card stack"><h2 class="h-sec" style="margin:0">Média por dimensão</h2><div class="evo-rows">${turmaDims.map(({ d, a, w, b }) => `<div class="evo-row"><strong>${d.nome}</strong>${evoBars(vals3(a, w, b), eixoCorEvo(d.eixo))}<span class="tnum evo-ab">${seq(vals3(a, w, b))}</span>${classeChip(classeEvo(a, w, b, EVO_CORTE.dim), b - a)}</div>`).join('')}</div></div>
    </div>`;
  const fila = `<div class="card stack"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 class="h-sec" style="margin:0">Relatórios de evolução</h2>${rascunhos.length ? `<button type="button" class="btn btn-primary btn-sm" data-act="evo-liberar-todos">Liberar ${rascunhos.length === 1 ? 'o rascunho' : `os ${rascunhos.length} rascunhos`}</button>` : ''}</div>
    ${tabelaEvos(cmps)}
    <p class="small muted">A pessoa só vê o relatório depois de liberado. Sinais indicam mudança no modo de compra, queda de confiabilidade ou salto otimista no workshop; revise antes de liberar.</p></div>`;
  return config + andamento + turmaCard + fila + blocoInternos;
}

/* ============================== FACILITADOR =============================== */
async function loadPessoas() {
  try { S.fac.pessoas = await store.pessoas(); } catch (e) { S.fac.pessoas = []; S.fac.pessoasErro = e.message; }
}
async function loadFac() {
  await loadPessoas();
  try {
    S.fac.turmas = await store.listTurmas();
    if (!S.fac.sel) S.fac.sel = S.fac.turmas[0]?.id || 'todos';
    S.fac.results = S.fac.sel === 'individuais' ? [] : await store.turmaResults(S.fac.sel);
  } catch (e) { S.fac.turmas = S.fac.turmas || []; S.fac.results = []; toast(e.message); }
  if (S.fac.tab === 'evolucao') await loadEvos();
}

function csvOf(results) {
  const head = ['nome', 'data', 'indice', 'nivel', 'perfil', 'aproximacao', 'afastamento', ...DIMS.map(d => d.id + '_' + d.nome), 'assertiva', 'passiva', 'agressiva', 'alertas', 'hesitacoes', 'trocas', 'historia', 'negocio', 'oferta', 'modo', 'confiabilidade'];
  const q = v => /[",;\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const rows = results.map(x => { const r = x.resultado; return [x.nome || '', x.created_at.slice(0, 10), r.indice, r.nivel, PROFILES[r.perfil].nome, r.aprox, r.afast, ...DIMS.map(d => r.dims[d.id]), r.postura.assertiva, r.postura.passiva, r.postura.agressiva, r.alerts.map(a => a.t).join(' | '), r.sinais ? r.sinais.hesitacoes.length : '', r.sinais ? r.sinais.trocas.length : '', x.respostas?.historia || '', SEG[x.respostas?.negocio?.segmento]?.nome || '', x.respostas?.negocio?.oferta || '', x.respostas?.negocio ? (modoDe(x.respostas.negocio) === 'contato' ? 'pontos de contato' : 'conversa') : '', r.confiab ? r.confiab.score : ''].map(q).join(','); });
  return [head.map(q).join(','), ...rows].join('\n');
}
