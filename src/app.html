    </div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px"><h2 class="h-sec" style="margin:0">Mapa da turma</h2><div class="actions"><button class="btn btn-quiet btn-sm" data-act="copiar-csv">Copiar CSV</button>${LIVE ? '<button class="btn btn-quiet btn-sm" data-act="baixar-csv">Baixar CSV</button>' : ''}</div></div>
      <textarea id="csv-fallback" hidden readonly style="width:100%;min-height:120px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px"></textarea>
      <div class="table-wrap"><table class="heat"><thead><tr><th>Pessoa</th><th class="num">Índice</th><th>Perfil</th><th>Negócio</th>${DIMS.map(d => `<th class="num" title="${d.nome}">${d.nome}</th>`).join('')}<th>Data</th><th>Alertas</th><th>Sinais</th><th>Confiabilidade</th></tr></thead><tbody>
      ${res.map(x => { const r = x.resultado; return `<tr><td><button class="link-btn" data-fac-open="${esc(x.id)}">${esc(x.nome || 'Sem nome')}</button>${x.exemplo ? ' <span class="tag">exemplo</span>' : ''}</td><td class="num"><b>${r.indice}</b></td><td>${PROFILES[r.perfil].nome}</td><td>${esc((SEG[x.respostas?.negocio?.segmento]?.nome || '—') + (x.respostas?.negocio?.oferta ? ' · ' + x.respostas.negocio.oferta : '') + (modoDe(x.respostas?.negocio) === 'contato' ? ' · escolhem sozinhos' : ''))}</td>${DIMS.map(d => `<td class="cell" style="${heat(r.dims[d.id])}">${r.dims[d.id]}</td>`).join('')}<td>${fmtDate(x.created_at)}</td><td>${r.alerts.map(a => esc(a.t)).join(', ') || '—'}</td><td>${r.sinais ? `${r.sinais.hesitacoes.length} hesitações · ${r.sinais.trocas.length} trocas` : '—'}</td><td>${r.confiab ? `${r.confiab.score} · ${r.confiab.nivel}` : '—'}</td></tr>`; }).join('')}
      </tbody></table></div>
      <p class="small muted" style="margin-top:10px">Cor mais intensa indica pontuação mais alta. Toque no nome para abrir o relatório da pessoa.</p>
    </div>`;
  return `<main class="page"><div class="wrap stack-lg">
    <div class="stack" style="gap:6px"><span class="eyebrow">Painel do facilitador</span><h1 style="font-size:clamp(28px,5vw,40px)">${F.tab === 'pessoas' ? 'Pessoas e acessos' : F.tab === 'evolucao' ? 'Evolução da turma' : 'Turmas e resultados'}</h1></div>
    <div class="tabs fac-tabs" role="tablist"><button role="tab" data-fac-tab="resultados" aria-selected="${F.tab === 'resultados'}">Turmas e resultados</button><button role="tab" data-fac-tab="evolucao" aria-selected="${F.tab === 'evolucao'}">Evolução</button><button role="tab" data-fac-tab="pessoas" aria-selected="${F.tab === 'pessoas'}">Pessoas e acessos${pedidosPendentes() ? ` · ${pedidosPendentes()}` : ''}</button></div>
    ${F.tab === 'pessoas' ? viewPessoas() : F.tab === 'evolucao' ? `<div class="stack" style="gap:10px"><span class="small muted">Turma</span><div class="turma-chips">${turmas.map(t => `<button data-turma="${esc(t.id)}" aria-pressed="${F.sel === t.id}">${esc(t.nome)}</button>`).join('')}<button data-turma="individuais" aria-pressed="${F.sel === 'individuais'}">Individuais</button></div></div>${viewEvolucaoTurma()}` : `
    <div class="card stack">
      <form id="f-turma" class="inline-form turma-form" novalidate><div class="field"><label for="tm-nome">Nova turma</label><input id="tm-nome" type="text" placeholder="Ex.: Workshop grupo de networking · novembro" required></div><div class="field"><label for="tm-workshop">Data do workshop</label><input id="tm-workshop" type="date" min="${hojeBR()}"></div><div class="field"><label for="tm-expira">Diagnósticos até</label><input id="tm-expira" type="date" value="${somaDias(hojeBR(), 90)}" min="${hojeBR()}"></div><button class="btn btn-primary btn-sm" type="submit">Criar turma e gerar código</button></form>
      <label class="check" for="tm-patro"><input id="tm-patro" type="checkbox"><span>Turma patrocinada: uma empresa contratou a avaliação e o desenvolvimento do time.</span></label>
      <label class="check" for="tm-nicho"><input id="tm-nicho" type="checkbox" checked><span>Perguntar o tipo de negócio de cada participante. Indicado para grupos abertos e networking; desligue para turmas de uma mesma empresa.</span></label>
      <p class="small muted">Etapas da turma: prévia antes do workshop, uma execução no dia do workshop e a reavaliação a partir de 45 dias depois. Entre o workshop e os 45 dias, ninguém executa.</p>
      ${F.newCode ? `<div class="msg msg-ok" role="status">Turma criada. Código de acesso: <span class="code-box">${esc(F.newCode)}</span> <button type="button" class="link-btn" data-copy="${esc(F.newCode)}">Copiar</button></div>` : ''}
    </div>
    <div class="stack" style="gap:10px"><span class="small muted">Turma selecionada${selT ? ` · código <b class="tnum" style="color:var(--ink)">${esc(selT.codigo)}</b> <button type="button" class="link-btn small" data-copy="${esc(selT.codigo)}">copiar</button> · tipo de negócio: <b style="color:var(--ink)">${selT.perguntar_nicho === false ? 'não pergunta' : 'pergunta'}</b> <button type="button" class="link-btn small" data-act="turma-nicho">alterar</button>` : ''}</span><div class="turma-chips">${chips}</div>
      ${selT ? `<div class="validade-row small"><span class="muted">Diagnósticos desta turma ${selT.expira_em ? (selT.expira_em >= hojeBR() ? 'liberados até' : 'encerrados · último dia') + ` <b style="color:var(--ink)">${fmtDia(selT.expira_em)}</b>` : '<b style="color:var(--ink)">sem prazo</b>'}</span><input type="date" id="tm-expira-sel" aria-label="Nova validade da turma" value="${esc(selT.expira_em || '')}"><button type="button" class="btn btn-quiet btn-sm" data-act="turma-expira">Salvar validade</button>${!selT.expira_em || selT.expira_em >= hojeBR() ? '<button type="button" class="btn btn-quiet btn-sm" data-act="turma-encerrar">Encerrar hoje</button>' : ''}</div>` : ''}
      ${selT ? `<div class="validade-row small"><span class="muted">Workshop ${selT.data_workshop ? `em <b style="color:var(--ink)">${fmtDia(selT.data_workshop)}</b>` : '<b style="color:var(--ink)">sem data</b>'}${selT.reavaliar_em ? ` · 45 dias a partir de <b style="color:var(--ink)">${fmtDia(selT.reavaliar_em)}</b>` : ''} · etapa de hoje: <b style="color:var(--ink)">${ETAPA_NOME[etapaTurma(selT, hojeBR())]}</b></span><input type="date" id="tm-workshop-sel" aria-label="Data do workshop" value="${esc(selT.data_workshop || '')}"><button type="button" class="btn btn-quiet btn-sm" data-act="turma-workshop">Salvar data do workshop</button></div>
      <div class="validade-row small"><span class="muted">Turma <b style="color:var(--ink)">${selT.patrocinada ? 'patrocinada' : 'sem patrocinador'}</b></span><button type="button" class="link-btn small" data-act="turma-patrocinada">${selT.patrocinada ? 'marcar como sem patrocinador' : 'marcar como patrocinada'}</button></div>` : ''}</div>
    ${F.results === null ? '<p class="muted">Carregando…</p>' : modoChips + body}`}
  </div></main>`;
}

/* ================================ RENDER ================================== */
function installBar() {
  if (!S.installEvt || S.installHidden) return '';
  return `<div class="install no-print"><div class="wrap"><span class="small">Instale o Diagnóstico OQGCI como aplicativo no seu celular.</span><span class="actions" style="flex-wrap:nowrap"><button class="btn btn-primary btn-sm" data-act="instalar" style="width:auto">Instalar</button><button class="btn btn-quiet btn-sm" data-act="fechar-instalar" style="width:auto" aria-label="Fechar aviso">✕</button></span></div></div>`;
}

function siteFooter() {
  return `<footer class="site-foot"><div class="wrap"><img src="${LOGO_CLARO}" alt="Logo de ${AUTOR}" class="foot-logo" width="56" height="62" onerror="this.hidden=true">
    <div class="foot-text"><p>${esc(COPYRIGHT)}</p><p><button class="link-btn small" data-go="referencias">Referências científicas</button></p></div></div></footer>`;
}

function render() {
  const views = { inicio: viewInicio, referencias: viewReferencias, entrar: viewEntrar, painel: viewPainel, diagnostico: viewDiagnostico, resultado: viewResultado, evolucao: viewEvolucao, facilitador: viewFacilitador, 'nova-senha': viewNovaSenha };
  trackVisit();
  $('#app').innerHTML = topBar() + views[S.route]() + siteFooter() + installBar();
  if (S.route === 'resultado') afterRenderResultado();
}

/* ================================ EVENTOS ================================= */
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-go],[data-act],[data-tab],[data-ans],[data-sjt],[data-open],[data-fac-open],[data-turma],[data-copy],[data-seg],[data-modo],[data-fac-modo],[data-fac-tab],[data-fac-filtro],[data-evo-open],[data-evo-mine]');
  if (!t) return;
  if (t.dataset.go) { if (t.dataset.go === 'diagnostico' && !S.quiz) startQuiz(); go(t.dataset.go); return; }
  if (t.dataset.tab) { S.authTab = t.dataset.tab; S.authMsg = null; render(); return; }
  if (t.dataset.copy) { copyText(t.dataset.copy); return; }
  if (t.dataset.seg) { const q = S.quiz; q.negocio = { ...(q.negocio || {}), segmento: t.dataset.seg, oferta: ($('#qz-oferta')?.value || '').trim() }; saveDraft(); render(); return; }
  if (t.dataset.modo) { const q = S.quiz; q.negocio = { ...(q.negocio || {}), modo: t.dataset.modo, oferta: ($('#qz-oferta')?.value || '').trim() }; saveDraft(); render(); return; }
  if (t.dataset.ans) {
    const q = S.quiz; const it = ITEMS_SHOWN[q.step - 1]; const v = Number(t.dataset.ans); noteChange(it.c, q.items[it.c], v); q.items[it.c] = v; saveDraft(); S.enter = false; render();
    $('[data-act=qz-next],[data-act=qz-finish]')?.focus({ preventScroll: true });
    return;
  }
  if (t.dataset.sjt) {
    const q = S.quiz; const sc = SJT[q.step - 1 - ITEMS.length]; noteChange(sc.id, q.sjt[sc.id], t.dataset.sjt); q.sjt[sc.id] = t.dataset.sjt; saveDraft(); S.enter = false; render();
    $('[data-act=qz-next],[data-act=qz-finish]')?.focus({ preventScroll: true });
    return;
  }
  if (t.dataset.open) { const r = await store.getResult(t.dataset.open); if (r) { S.result = r; go('resultado'); } return; }
  if (t.dataset.facOpen) { const r = (S.fac.results || []).find(x => x.id === t.dataset.facOpen); if (r) { S.result = r; go('resultado'); } return; }
  if (t.dataset.facModo) { S.fac.modo = t.dataset.facModo; render(); return; }
  if (t.dataset.facTab) {
    S.fac.tab = t.dataset.facTab;
    if (S.fac.tab === 'resultados' && S.fac.sel === 'individuais') { S.fac.sel = (S.fac.turmas || [])[0]?.id || 'todos'; S.fac.results = null; render(); try { S.fac.results = await store.turmaResults(S.fac.sel); } catch (e) { S.fac.results = []; } }
    render();
    if (S.fac.tab === 'pessoas') { S.fac.pessoas = null; render(); await loadPessoas(); render(); }
    if (S.fac.tab === 'evolucao') {
      const turmas = S.fac.turmas || [];
      if (S.fac.sel !== 'individuais' && !turmas.some(x => x.id === S.fac.sel) && turmas[0]) { S.fac.sel = turmas[0].id; S.fac.results = null; }
      S.fac.evos = null; render();
      try { if (S.fac.results === null) S.fac.results = S.fac.sel === 'individuais' ? [] : await store.turmaResults(S.fac.sel); } catch (e) { S.fac.results = []; }
      await loadEvos(); render();
    }
    return;
  }
  if (t.dataset.evoOpen) {
    const e = (S.fac.evos || []).find(x => x.id === t.dataset.evoOpen); if (!e) return;
    let serie = null; if (tipoEvo(e) === 'individual') { try { serie = await store.resultadosDe(e.user_id); } catch (x) { serie = null; } }
    S.evo = { ev: e, from: 'fac', serie }; go('evolucao'); return;
  }
  if (t.dataset.evoMine) { const e = (S.minhasEvos || []).find(x => x.id === t.dataset.evoMine); if (e) { S.evo = { ev: e, from: 'painel', serie: tipoEvo(e) === 'individual' ? (S.myResults || []).slice().sort((a, b) => a.created_at.localeCompare(b.created_at)) : null }; go('evolucao'); } return; }
  if (t.dataset.facFiltro) { S.fac.filtro = t.dataset.facFiltro; render(); return; }
  if (t.dataset.turma) { S.fac.sel = t.dataset.turma; S.fac.results = null; S.fac.evos = null; S.fac.newCode = null; render(); try { S.fac.results = S.fac.sel === 'individuais' ? [] : await store.turmaResults(S.fac.sel); } catch (e) { S.fac.results = []; toast(e.message); } if (S.fac.tab === 'evolucao') await loadEvos(); render(); return; }
  const act = t.dataset.act;
  if (act === 'criar') { S.authTab = 'criar'; S.authMsg = null; go('entrar'); }
  else if (act === 'esqueci') { S.authTab = 'esqueci'; S.authMsg = null; render(); }
  else if (act === 'sair') { await store.signOut(); S.session = null; S.result = null; S.quiz = null; S.fac = { turmas: null, sel: null, results: null, newCode: null, tab: 'resultados', pessoas: null, filtro: 'todos', busca: '', evos: null }; S.acesso = null; S.evo = null; S.reav = null; S.minhasEvos = null; S.pedido = null; go('inicio'); }
  else if (act === 'fac-demo') { S.session = await store.signInFacilitatorDemo(); go('facilitador'); }
  else if (act === 'qz-start') { quizStart(); }
  else if (act === 'qz-back') { const q = S.quiz; if (q.step === 1 && q.negocio) { q.step = 0; q.phase = 'negocio'; } else q.step = Math.max(0, q.step - 1); saveDraft(); render(); }
  else if (act === 'qz-next') { const q = S.quiz; q.step = Math.min(TOTAL, q.step + 1); saveDraft(); S.enter = true; render(); S.enter = false; }
  else if (act === 'qz-finish') { quizFinish(); }
  else if (act === 'prio-next' || act === 'prio-reset') {
    S.prioStep[t.dataset.key] = act === 'prio-next' ? Math.min(3, (S.prioStep[t.dataset.key] || 0) + 1) : 0;
    S.accOpen[t.dataset.id] = true; render();
    const cur = document.querySelector('#' + t.dataset.id + ' .path-step.cur, #' + t.dataset.id + ' .path-step.done:last-of-type');
    if (cur && act === 'prio-next') cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  else if (act === 'qz-negocio') {
    const q = S.quiz; q.negocio = { ...(q.negocio || {}), oferta: ($('#qz-oferta')?.value || '').trim() };
    if (!q.negocio.segmento) { toast('Escolha o tipo de negócio'); return; }
    if (!q.negocio.modo) { toast('Escolha como os seus clientes compram'); return; }
    q.phase = null; q.step = 1; saveDraft(); render();
  }
  else if (act === 'acesso-liberar' || act === 'acesso-encerrar' || act === 'acesso-reativar') {
    const id = t.dataset.user; const x = (S.fac.pessoas || []).find(p => p.id === id); if (!x) return;
    let ate = x.acesso_ate, bloq = x.acesso_bloqueado;
    if (act === 'acesso-liberar') { ate = document.querySelector(`[data-ate="${CSS.escape(id)}"]`)?.value; if (!ate) { toast('Escolha a data'); return; } bloq = false; }
    if (act === 'acesso-encerrar') bloq = true;
    if (act === 'acesso-reativar') bloq = false;
    try { await store.definirAcesso(id, ate, bloq); await loadPessoas(); render(); toast(act === 'acesso-liberar' ? 'Acesso liberado até ' + fmtDia(ate) : act === 'acesso-encerrar' ? 'Acesso encerrado' : 'Acesso reativado'); } catch (e) { toast(e.message); }
  }
  else if (act === 'acesso-estender') {
    const id = t.dataset.user; const x = (S.fac.pessoas || []).find(p => p.id === id); if (!x) return;
    try { await store.definirAcesso(id, t.dataset.ate, x.acesso_bloqueado); await loadPessoas(); render(); toast('Acesso liberado até ' + fmtDia(t.dataset.ate)); } catch (e) { toast(e.message); }
  }
  else if (act === 'exec-salvar') {
    const id = t.dataset.user; const x = (S.fac.pessoas || []).find(p => p.id === id); if (!x) return;
    const nova = Boolean(document.querySelector(`[data-nova="${CSS.escape(id)}"]`)?.checked);
    const lim = parseInt(document.querySelector(`[data-lim="${CSS.escape(id)}"]`)?.value || '0', 10);
    if (nova && !(lim > (x.diagnosticos || 0))) { toast(`O limite precisa ser maior que ${x.diagnosticos || 0}, o número de execuções já feitas.`); return; }
    try { await store.definirExecucoes(id, nova, nova ? lim : null); await loadPessoas(); render(); toast(nova ? `Nova execução liberada · limite total ${lim}` + (x.acesso_ate && x.acesso_ate >= hojeBR() ? '' : '. Defina também a data em "Liberar até"') : 'Nova execução desligada'); } catch (e) { toast(e.message); }
  }
  else if (act === 'pedido-liberar' || act === 'pedido-recusar') {
    const id = t.dataset.user; const x = (S.fac.pessoas || []).find(p => p.id === id); if (!x) return;
    const q = sel => document.querySelector(`[${sel}="${CSS.escape(id)}"]`);
    const resposta = (q('data-resp')?.value || '').trim();
    const aprovar = act === 'pedido-liberar';
    const lim = parseInt(q('data-plim')?.value || '0', 10); const ate = q('data-pate')?.value || null;
    if (aprovar && !(lim > (x.diagnosticos || 0))) { toast(`O limite precisa ser maior que ${x.diagnosticos || 0}, o número de execuções já feitas.`); return; }
    if (aprovar && (!ate || ate < hojeBR())) { toast('Escolha uma data de hoje em diante'); return; }
    if (!aprovar && !resposta && !confirm('Recusar sem resposta? A pessoa vê apenas que o pedido foi recusado.')) return;
    try { await store.decidirPedido(t.dataset.pedido, aprovar, resposta, aprovar ? lim : null, aprovar ? ate : null); await loadPessoas(); render(); toast(aprovar ? `Nova execução liberada para ${x.nome || 'a pessoa'}` : 'Pedido recusado'); } catch (e) { toast(e.message); }
  }
  else if (act === 'turma-expira' || act === 'turma-encerrar') {
    const tm = (S.fac.turmas || []).find(x => x.id === S.fac.sel); if (!tm) return;
    const v = act === 'turma-encerrar' ? somaDias(hojeBR(), -1) : ($('#tm-expira-sel')?.value || null);
    try { await store.updateTurma(tm.id, { expira_em: v }); S.fac.turmas = await store.listTurmas(); S.fac.pessoas = null; render(); toast(act === 'turma-encerrar' ? 'Diagnósticos da turma encerrados' : v ? 'Turma liberada até ' + fmtDia(v) : 'Turma sem prazo'); } catch (e) { toast(e.message); }
  }
  else if (act === 'turma-workshop') {
    const tm = (S.fac.turmas || []).find(x => x.id === S.fac.sel); if (!tm) return;
    const w = $('#tm-workshop-sel')?.value || null;
    const patch = { data_workshop: w };
    if (w && (!tm.reavaliar_em || (tm.data_workshop && tm.reavaliar_em === somaDias(tm.data_workshop, 45)))) patch.reavaliar_em = somaDias(w, 45);
    if (w && tm.expira_em && tm.expira_em < somaDias(w, 60)) patch.expira_em = somaDias(w, 60);
    try { await store.updateTurma(tm.id, patch); S.fac.turmas = await store.listTurmas(); await loadPessoas(); render(); toast(w ? 'Workshop em ' + fmtDia(w) + (patch.reavaliar_em ? ' · 45 dias a partir de ' + fmtDia(patch.reavaliar_em) : '') : 'Data do workshop removida'); } catch (e) { toast(e.message); }
  }
  else if (act === 'turma-patrocinada') {
    const tm = (S.fac.turmas || []).find(x => x.id === S.fac.sel); if (!tm) return;
    try { await store.updateTurma(tm.id, { patrocinada: !tm.patrocinada }); S.fac.turmas = await store.listTurmas(); render(); toast(tm.patrocinada ? 'Turma sem patrocinador' : 'Turma patrocinada'); } catch (e) { toast(e.message); }
  }
  else if (act === 'turma-nicho') {
    const tm = (S.fac.turmas || []).find(x => x.id === S.fac.sel); if (!tm) return;
    try { await store.updateTurma(tm.id, { perguntar_nicho: tm.perguntar_nicho === false }); S.fac.turmas = await store.listTurmas(); render(); toast('Configuração da turma atualizada'); } catch (e) { toast(e.message); }
  }
  else if (act === 'turma-reavaliar' || act === 'turma-reavaliar-limpar') {
    const tm = (S.fac.turmas || []).find(x => x.id === S.fac.sel); if (!tm) return;
    const v = act === 'turma-reavaliar-limpar' ? null : ($('#tm-reavaliar')?.value || null);
    if (act === 'turma-reavaliar' && !v) { toast('Escolha a data de reavaliação'); return; }
    if (act === 'turma-reavaliar-limpar' && (S.fac.evos || []).some(e => e.status === 'liberado') && !confirm('Remover a data de reavaliação? Os relatórios já liberados continuam com as pessoas; os rascunhos são descartados.')) return;
    try { await store.updateTurma(tm.id, { reavaliar_em: v }); S.fac.turmas = await store.listTurmas(); S.fac.evos = null; render(); await loadEvos(); render(); toast(v ? 'Reavaliação a partir de ' + fmtDia(v) : 'Data de reavaliação removida'); } catch (e) { try { S.fac.turmas = await store.listTurmas(); } catch (x) { /* */ } render(); toast(e.message); }
  }
  else if (act === 'turma-estender') {
    const tm = (S.fac.turmas || []).find(x => x.id === S.fac.sel); if (!tm) return;
    try { await store.updateTurma(tm.id, { expira_em: t.dataset.ate }); S.fac.turmas = await store.listTurmas(); render(); toast('Turma liberada até ' + fmtDia(t.dataset.ate)); } catch (e) { toast(e.message); }
  }
  else if (act === 'evo-salvar' || act === 'evo-liberar' || act === 'evo-recolher') {
    const ev = S.evo?.ev; if (!ev) return;
    const patch = {};
    if (act !== 'evo-recolher') patch.comentario = ($('#evo-com')?.value || '').trim() || null;
    if (act === 'evo-liberar') { patch.status = 'liberado'; patch.liberado_em = new Date().toISOString(); }
    if (act === 'evo-recolher') { patch.status = 'rascunho'; patch.liberado_em = null; }
    try {
      const novo = await store.updateEvolucao(ev.id, patch);
      if (novo) { S.evo.ev = novo; S.fac.evos = (S.fac.evos || []).map(x => x.id === novo.id ? novo : x); }
      render(); toast(act === 'evo-liberar' ? 'Relatório liberado para ' + (ev.nome || 'a pessoa') : act === 'evo-recolher' ? 'Relatório recolhido para rascunho' : 'Comentário salvo');
    } catch (e) { toast(e.message); }
  }
  else if (act === 'evo-liberar-todos') {
    const rs = (S.fac.evos || []).filter(e => e.status !== 'liberado' && tipoEvo(e) !== 'workshop'); if (!rs.length) return;
    const comSinal = rs.filter(e => compararEvolucao(e).sinais.length).length;
    if (!confirm(`Liberar ${rs.length} ${rs.length === 1 ? 'relatório' : 'relatórios'} para as pessoas?${comSinal ? `\n\n${comSinal} ${comSinal === 1 ? 'tem sinal' : 'têm sinais'} para revisão.` : ''}`)) return;
    try { const agora = new Date().toISOString(); for (const e of rs) await store.updateEvolucao(e.id, { status: 'liberado', liberado_em: agora }); await loadEvos(); render(); toast(rs.length === 1 ? 'Relatório liberado' : rs.length + ' relatórios liberados'); } catch (e) { await loadEvos(); render(); toast(e.message); }
  }
  else if (act === 'evo-pdf') { exportPDF('download', true); }
  else if (act === 'evo-compartilhar') { exportPDF('share', true); }
  else if (act === 'pdf') { exportPDF('download'); }
  else if (act === 'compartilhar') { exportPDF('share'); }
  else if (act === 'email') { emailReport(); }
  else if (act === 'acc-all') {
    const els = [...document.querySelectorAll('details.' + t.dataset.target)];
    const open = els.some(e => !e.open);
    els.forEach(e => { e.open = open; S.accOpen[e.id] = open; });
    t.textContent = open ? 'Fechar todas' : 'Abrir todas';
  }
  else if (act === 'ler-historia') { delete S.leitura[S.result.id]; render(); }
  else if (act === 'copiar-resumo') { copyText(resumoTexto(S.result), $('#resumo-fallback')); }
  else if (act === 'imprimir') { window.print(); }
  else if (act === 'copiar-csv') { copyText(csvOf(S.fac.results || []), $('#csv-fallback')); }
  else if (act === 'baixar-csv') {
    const blob = new Blob(['﻿' + csvOf(S.fac.results || [])], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'diagnostico-oqgci.csv'; document.body.appendChild(a); a.click(); a.remove();
  }
  else if (act === 'instalar') { const e = S.installEvt; S.installEvt = null; render(); if (e) { e.prompt(); try { await e.userChoice; } catch (x) { /* */ } } }
  else if (act === 'fechar-instalar') { S.installHidden = true; render(); }
});

document.addEventListener('toggle', (ev) => { const d = ev.target; if (d && d.matches && d.matches('details[data-acc]')) S.accOpen[d.id] = d.open; }, true);

document.addEventListener('keydown', (ev) => {
  if (S.route !== 'diagnostico' || !S.quiz || S.quiz.step === 0) return;
  if (ev.target.closest('input,textarea')) return;
  const idx = S.quiz.step - 1;
  if (idx >= ITEMS.length + SJT.length) return;
  const n = idx < ITEMS.length ? 5 : 3;
  const k = idx < ITEMS.length ? Number(ev.key) : ' abc'.indexOf(ev.key.toLowerCase());
  if (k >= 1 && k <= n) { const btn = document.querySelectorAll('[data-ans],[data-sjt]')[k - 1]; if (btn) btn.click(); }
  else if (ev.key === 'Enter' && !ev.target.closest('button')) { const nx = $('[data-act=qz-next]:not([disabled]),[data-act=qz-finish]:not([disabled])'); if (nx) nx.click(); }
});

document.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const val = id => ($('#' + id)?.value || '');
  const fail = t => { S.busy = false; S.authMsg = { t }; render(); };
  if (f.id === 'f-entrar') {
    const email = val('in-email'), senha = val('in-senha');
    if (!email || !senha) return fail('Informe o e-mail e a senha.');
    S.busy = true; S.authMsg = null; render();
    try { S.session = await store.signIn({ email, senha }); S.busy = false; go('painel'); } catch (e) { fail(e.message); }
  } else if (f.id === 'f-criar') {
    const nome = val('cr-nome'), email = val('cr-email'), senha = val('cr-senha');
    if (!nome.trim() || !email.trim()) return fail('Informe o seu nome e o seu e-mail.');
    if (!/^\S+@\S+\.\S+$/.test(email.trim())) return fail('O e-mail parece incompleto. Confira e tente de novo.');
    if (senha.length < 6) return fail('A senha precisa ter pelo menos 6 caracteres.');
    if (!$('#cr-lgpd').checked) return fail('Para criar a conta, marque a autorização de uso das respostas.');
    S.busy = true; S.authMsg = null; render();
    try {
      const r = await store.signUp({ nome, email, senha });
      S.busy = false;
      if (r.needsConfirm) { S.authTab = 'entrar'; S.authMsg = { ok: true, t: 'Conta criada. Enviamos um link de confirmação para o seu e-mail. Depois de confirmar, entre com a sua senha.' }; render(); }
      else { S.session = r.user; go('painel'); }
    } catch (e) { fail(e.message); }
  } else if (f.id === 'f-esqueci') {
    const email = val('rs-email');
    if (!email.trim()) return fail('Informe o seu e-mail.');
    S.busy = true; render();
    try {
      const r = await store.resetPassword(email); S.busy = false;
      S.authMsg = { ok: true, t: r.demo ? 'Na prévia não há envio de e-mail. Na versão publicada, você recebe um link para criar uma nova senha.' : 'Se houver uma conta com esse e-mail, você vai receber um link para criar uma nova senha.' }; render();
    } catch (e) { fail(e.message); }
  } else if (f.id === 'f-nova') {
    const senha = val('nv-senha');
    if (senha.length < 6) return fail('A senha precisa ter pelo menos 6 caracteres.');
    try { await store.updatePassword(senha); S.session = await store.getSession(); S.authMsg = null; toast('Senha atualizada'); go('painel'); } catch (e) { fail(e.message); }
  } else if (f.id === 'f-codigo') {
    const code = val('pn-code').trim();
    const msg = t => { const el = $('#pn-msg'); if (el) el.innerHTML = `<div class="msg msg-err" role="alert">${esc(t)}</div>`; };
    if (!code) return msg('Informe o código da turma.');
    S.busy = true; render();
    try {
      const r = await store.entrarTurma(code); S.busy = false;
      if (r.status !== 'ok') { render(); return msg(msgCodigo(r)); }
      await loadAcesso(); render(); toast('Acesso liberado · turma ' + r.nome);
    } catch (e) { S.busy = false; render(); msg(e.message); }
  } else if (f.id === 'f-pedido') {
    const motivo = ($('#pd-motivo')?.value || '').trim();
    const pmsg = m => { const el = $('#pd-msg'); if (el) el.innerHTML = `<div class="msg msg-err" role="alert">${esc(m)}</div>`; };
    if (motivo.length < 10) return pmsg('Conte em poucas palavras por que você quer fazer um novo diagnóstico.');
    S.busy = true; S.pedidoRascunho = motivo; render();
    try { S.pedido = await store.pedirExecucao(motivo); S.pedidoRascunho = ''; S.busy = false; render(); toast('Pedido enviado para ' + AUTOR); }
    catch (e) { S.busy = false; render(); pmsg(e.message); }
  } else if (f.id === 'f-turma') {
    const nome = val('tm-nome');
    if (!nome.trim()) { toast('Dê um nome para a turma'); return; }
    const w = $('#tm-workshop')?.value || null; let expira = $('#tm-expira')?.value || null;
    if (w && expira && expira < somaDias(w, 60)) expira = somaDias(w, 60);
    const extra = { patrocinada: Boolean($('#tm-patro')?.checked) };
    if (w) { extra.data_workshop = w; extra.reavaliar_em = somaDias(w, 45); }
    try { const t = await store.createTurma(nome, $('#tm-nicho')?.checked !== false, expira, extra); S.fac.newCode = t.codigo; S.fac.sel = t.id; S.fac.turmas = await store.listTurmas(); S.fac.results = await store.turmaResults(t.id); render(); }
    catch (e) { toast(e.message); }
  }
});

window.addEventListener('hashchange', route_);
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; render(); });

/* ================================ INÍCIO ================================== */
(async function boot() {
  $('#app').innerHTML = topBar() + '<main class="page"><div class="wrap"><p class="muted">Carregando…</p></div></main>';
  try {
    await store.init(() => { S.authMsg = null; S.route = 'nova-senha'; location.hash = 'nova-senha'; render(); });
    S.session = await store.getSession();
  } catch (e) {
    S.session = null;
    console.error(e);
  }
  if (location.hash.slice(1) === 'nova-senha' && LIVE) { S.route = 'nova-senha'; render(); return; }
  route_();
})();

window.__OQGCI = { scoreAnswers, ITEMS, SJT, DIMS };
})();
</script>
